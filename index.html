<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEJUL 선박관리 앱</title>
<meta name="theme-color" content="#1F3864"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.SJAPP = { isHub: true, swPath: 'sw.js' };</script><script src="common.js"></script>
<style>
:root{--navy:#1F3864;--navy2:#2b4c86;--gold:#F5B800;--bg:#f2f4f8;--line:#dfe6f0;--mut:#5b6577}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:#1d2533}
header{background:var(--navy);color:#fff;padding:14px 20px calc(14px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:40px;height:40px;border-radius:10px}header h1{margin:0;font-size:20px}header small{display:block;opacity:.75;font-size:12px;font-weight:400}
header .sp{flex:1}.pill{border:1px solid #ffffff44;border-radius:16px;padding:4px 10px;font-size:12.5px}.pill.on{background:#2E7D32;border-color:#2E7D32}.pill.off{background:#C62828;border-color:#C62828}
.lang{display:flex;border:1px solid #ffffff55;border-radius:8px;overflow:hidden}.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}.lang button.on{background:var(--gold);color:var(--navy);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:16px;margin:22px 0 10px;color:var(--navy)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 2px 8px #1f386410;transition:.15s}
.tool:hover{transform:translateY(-2px);box-shadow:0 6px 18px #1f386422;border-color:var(--navy2)}
.tool .ic{font-size:36px}.tool b{font-size:18px}.tool .en{color:var(--mut);font-size:13px}.tool p{margin:4px 0 0;color:#3a4558;font-size:13.5px;line-height:1.5}.tool .v{margin-top:auto;font-size:12px;color:var(--mut)}
.tool.soon{opacity:.55;pointer-events:none;border-style:dashed}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.row{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row>label{font-weight:700;font-size:14px}.row .h{grid-column:2;color:var(--mut);font-size:12.5px;margin-top:-4px}
select,input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c6d1e2;border-radius:8px;background:#fff;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid #c6d1e2;background:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.btn.p{background:var(--navy);color:#fff}.btn.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.st{font-size:13px}.ok{color:#2E7D32;font-weight:700}.warn{color:#B54708;font-weight:700}
.note{background:#eef3fa;border-radius:10px;padding:10px 14px;font-size:13px;color:#3a4558;line-height:1.6;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .h{grid-column:1}header h1{font-size:17px}}
</style></head><body>
<header><img src="icon-192.png" alt=""><div><h1 data-t="SEJUL 선박관리 앱|SEJUL Fleet Apps"></h1><small>SEJUL SHIP MANAGEMENT CO., LTD.</small></div><span class="sp"></span>
  <span class="pill" id="net"></span><span class="pill" id="ves"></span><div class="lang"><button data-lang="ko">한국어</button><button data-lang="en">English</button></div></header>
<main>
  <div class="note" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap" id="instTop"><span data-t="📥 이 앱을 PC에 설치하면 바탕화면 아이콘으로 열리고, 인터넷 없이도 씁니다.|📥 Install this app to open it from the desktop and use it offline."></span><button class="btn g" onclick="document.getElementById('cInst').click()" data-t="⬇ 이 PC에 설치|⬇ Install"></button></div><div id="inst" class="note" hidden></div>
  <h2 data-t="도구|Tools"></h2>
  <div class="tools">
    <a class="tool" href="tools/pms.html"><span class="ic">🔧</span><b data-t="계획정비 (PMS)|Planned Maintenance"></b><span class="en" data-t="PMS · SFI · 점검표 · 결함 · 인벤토리 · 선급 검사|PMS · SFI · Checklists · Defects · Inventory · Class surveys"></span><p data-t="SFI 계통 장비·작업, 정기 점검표, 결함 보고·수리 신청, 예비품·청구, 검교정·선급 검사|SFI equipment & jobs, checklists, defects, spares & requisitions, calibration & class surveys"></p><span class="v">PMS 2.3.0 (v19)</span></a>
    <a class="tool" href="tools/rsk.html"><span class="ic">⚠️</span><b data-t="위험성 관리 (RSK-P-01)|Risk Management"></b><span class="en">RA · JSA · TBM · PTW · MoC</span><p data-t="위험성 평가·TBM, 작업허가서, 변화관리, 위험성 식별 보고, 위험성 등록부|Risk assessment & TBM, permits to work, MoC, risk ID reports, risk register"></p><span class="v">RSK v1.23</span></a>
    <div class="tool soon"><span class="ic">🧪</span><b data-t="화물 호환성 (Stowage)|Cargo compatibility"></b><span class="en">Stowage Plan</span><p data-t="검토·개선 후 추가 예정|Coming after review"></p></div>
    <div class="tool soon"><span class="ic">📑</span><b data-t="SMS 서식|SMS forms"></b><span class="en">SMS Forms</span><p data-t="추가 예정|Planned"></p></div>
  </div>
  <h2 data-t="공통 설정 — 모든 도구에 적용|Common settings — applied to all tools"></h2>
  <div class="card">
    <div class="row"><label data-t="선박|Vessel"></label><select id="cVes"></select><div class="h" data-t="이 PC(기기)가 쓰는 선박. 사무실이면 '사무실'.|Vessel used on this device; choose Office for shore."></div></div>
    <div class="row"><label data-t="이 PC 이름|This PC"></label><div><div class="chips" id="cPcP"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="cPc" placeholder="예: 개인 PC - 1항사 홍길동" style="flex:1"><button class="btn" id="cPcS" data-t="저장|Save"></button></div></div><div class="h" data-t="같은 폴더·서버를 쓰는 여러 PC를 구분합니다.|Tells several PCs apart."></div></div>
    <div class="row"><label data-t="데이터 폴더|Data folder"></label><div><span class="st" id="cDirSt"></span> <button class="btn p" id="cDir" data-t="📁 폴더 선택|📁 Choose folder"></button></div><div class="h" data-t="한 번 고르면 PMS·위험성 관리 모두 이 폴더에 저장합니다 (선교·CCR·ECR 공유 폴더 권장).|Both tools save to this folder (a shared folder is recommended)."></div></div>
    <div class="row"><label data-t="서버 동기화|Server sync"></label><div><span class="st warn" data-t="준비 중 — 회사 서버 연결 후 사용|Coming — after the company server is set up"></span></div><div class="h" data-t="인터넷이 되면 선박↔사무실 자료를 자동으로 주고받습니다. 지금은 공유 폴더·사무실 회신 파일로 주고받습니다.|Automatic ship↔office sync when online. For now, shared folder and reply files."></div></div>
    <div class="row"><label data-t="앱|App"></label><div><span class="st">v2026.11.11.1252</span> <button class="btn" id="cUpd" data-t="업데이트 확인|Check for updates"></button> <button class="btn g" id="cInst" data-t="⬇ 이 PC에 설치|⬇ Install on this PC"></button> <span class="st" id="cUpdSt"></span></div></div>
  </div>
  <div class="note" data-t="📶 한 번 설치하면 인터넷 없이 선박에서 그대로 쓸 수 있습니다. 인터넷이 연결되면 새 버전을 자동으로 받습니다. 입력한 자료는 이 PC(와 고른 폴더)에만 저장되고, 앱 주소(서버)로는 올라가지 않습니다.|📶 Once installed, works offline on board. Updates download automatically when online. Your records stay on this PC (and the chosen folder)."></div>
</main>
<footer>SEJUL SHIP MANAGEMENT · <span id="swst"></span></footer>
<script>
const VES = ['KTS GOLD','KTS SILVER','KTS RED','KTS WHITE','KTS GREEN','KTS BLUE','SKY ROYAL','SUNNY QUEEN'];
let LANG = SJAPP.get('lang') || 'ko';
const T = s => { const [k, e] = s.split('|'); return LANG === 'en' ? (e || k) : k; };
function paint(){ document.documentElement.lang = LANG; document.querySelectorAll('[data-t]').forEach(x => x.textContent = T(x.dataset.t)); document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  const v = SJAPP.get('vessel') || ''; const s = document.getElementById('cVes'); s.innerHTML = `<option value="">${T('— 선택 —|— select —')}</option>` + VES.map(n => `<option ${n === v ? 'selected' : ''}>${n}</option>`).join('') + `<option value="__office" ${v === '__office' ? 'selected' : ''}>🏢 ${T('사무실 (전 선대)|Office (all vessels)')}</option>`;
  document.getElementById('ves').textContent = v === '__office' ? '🏢 ' + T('사무실|Office') : v ? '🚢 ' + v : T('선박 미설정|No vessel');
  const pc = SJAPP.get('pcname') || ''; document.getElementById('cPc').value = pc; document.getElementById('cPcP').innerHTML = ['선교','CCR','ECR','선장실','기관장실','개인 PC - ','사무실 - '].map(x => `<button class="${pc === x ? 'on' : ''}" data-pcp="${x}">${x.replace(' - ', '')}</button>`).join('');
  net(); dirSt(); }
function net(){ const n = document.getElementById('net'); n.textContent = navigator.onLine ? T('● 온라인|● Online') : T('○ 오프라인|○ Offline'); n.className = 'pill ' + (navigator.onLine ? 'on' : 'off'); }
async function dirSt(){ const h = await SJAPP.dirGet(), s = document.getElementById('cDirSt'); if (!h){ s.innerHTML = `<span class="warn">${T('미연결 — 이 브라우저에만 저장|Not connected — browser only')}</span>`; return; } let p = 'prompt'; try { p = await h.queryPermission({ mode: 'readwrite' }); } catch (e) {} s.innerHTML = `📁 <b>${h.name}</b> ${p === 'granted' ? `<span class="ok">✓</span>` : `<span class="warn">${T('(다음 사용 때 허용 필요)|(needs permission)')}</span>`}`; }
document.addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang){ LANG = b.dataset.lang; SJAPP.set('lang', LANG); paint(); }
  else if (b.dataset.pcp != null){ const i = document.getElementById('cPc'); i.value = b.dataset.pcp; i.focus(); if (!/ - $/.test(b.dataset.pcp)){ SJAPP.set('pcname', i.value); paint(); } }
  else if (b.id === 'cPcS'){ const v = document.getElementById('cPc').value.trim(); if (v){ SJAPP.set('pcname', v); paint(); } }
  else if (b.id === 'cDir'){ if (!window.showDirectoryPicker) return alert(T('이 브라우저는 폴더 저장을 지원하지 않습니다 — Chrome·Edge를 쓰세요.|Use Chrome or Edge for folder saving.')); try { const h = await showDirectoryPicker({ id: 'sejul', mode: 'readwrite' }); await h.requestPermission({ mode: 'readwrite' }); await SJAPP.dirSet(h); dirSt(); } catch (err) {} }
  else if (b.id === 'cUpd'){ const s = document.getElementById('cUpdSt'); s.textContent = T('확인 중…|Checking…'); try { const r = await navigator.serviceWorker.getRegistration(); await r.update(); setTimeout(() => s.textContent = r.waiting || r.installing ? T('새 버전을 받는 중 — 곧 안내가 뜹니다|Downloading new version') : T('최신 버전입니다|Up to date'), 1500); } catch (err) { s.textContent = T('오프라인 — 나중에 다시|Offline — try later'); } }
  else if (b.id === 'cInst'){ if (window.__bip){ __bip.prompt(); const r = await __bip.userChoice.catch(() => ({})); __bip = null; if (r.outcome === 'accepted') paintInst(); } else instHelp(); } });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function paintInst(){ const b = document.getElementById('cInst'), n = document.getElementById('inst'); if (standalone()){ b.hidden = true; document.getElementById('instTop').hidden = true; n.hidden = false; n.innerHTML = '✅ ' + T('설치된 앱으로 실행 중입니다. 인터넷 없이도 열립니다.|Running as an installed app — works offline.'); } }
function instHelp(){ const ua = navigator.userAgent, edge = /Edg\//.test(ua), chrome = /Chrome\//.test(ua) && !edge && !/OPR|Whale|SamsungBrowser/.test(ua), ios = /iPhone|iPad/.test(ua), n = document.getElementById('inst'); n.hidden = false;
  n.innerHTML = '<b>⬇ ' + T('설치 방법|How to install') + '</b><br>' + (ios ? T('iPhone·iPad: Safari 아래쪽 [공유 ⬆] → [홈 화면에 추가]|iPhone/iPad: Safari Share → Add to Home Screen')
   : edge ? T('Edge: 주소창 오른쪽 [앱 설치 ⊕] 아이콘 → [설치]. 아이콘이 없으면 오른쪽 위 [···] → [앱] → [이 사이트를 앱으로 설치]|Edge: address bar install icon, or ··· → Apps → Install this site as an app')
   : chrome ? T('Chrome: 주소창 오른쪽 [설치 ⊕(모니터 모양)] 아이콘 → [설치]. 아이콘이 없으면 오른쪽 위 [⋮] → [전송, 저장, 공유] → [페이지를 앱으로 설치…]|Chrome: address bar install icon, or ⋮ → Cast, save and share → Install page as app')
   : T('설치는 Chrome 또는 Edge에서 됩니다. 이 주소를 Chrome·Edge로 열어 주세요.|Please open this address in Chrome or Edge to install.'))
   + '<br><span style="color:#5b6577">' + T('설치 아이콘은 페이지를 연 뒤 몇 초 지나야 나타날 수 있습니다. 이미 설치했다면 바탕화면·시작 메뉴의 SEJUL 아이콘으로 여세요.|The install icon may take a few seconds to appear. If already installed, open SEJUL from the desktop / Start menu.') + '</span>'; }
addEventListener('appinstalled', () => { const n = document.getElementById('inst'); n.hidden = false; n.innerHTML = '✅ ' + T('설치되었습니다 — 바탕화면·시작 메뉴의 SEJUL 아이콘으로 여세요.|Installed — open SEJUL from the desktop / Start menu.'); document.getElementById('cInst').hidden = true; });
document.getElementById('cVes').onchange = e => { SJAPP.set('vessel', e.target.value); paint(); };
addEventListener('online', net); addEventListener('offline', net);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__bip = e; });
paint(); paintInst(); SJAPP.watchUpdate();
navigator.serviceWorker && navigator.serviceWorker.ready.then(() => document.getElementById('swst').textContent = T('오프라인 사용 준비됨 ✓|Ready for offline use ✓'));
</script></body></html>
