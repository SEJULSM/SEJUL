<style>

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kt{border-radius:12px;padding:12px;background:#F1F3F6;text-decoration:none;color:var(--ink);display:block}.kt b{display:block;font-size:26px;font-weight:800;line-height:1.2}.kt span{font-size:12.5px;color:var(--mut)}

.tw{overflow-x:auto}table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}table.t th{background:#F8F9FB;color:var(--mut);font-size:12.5px;text-align:left;padding:10px 12px;font-weight:700}table.t th:first-child,table.t td:first-child{padding-left:20px}table.t td{padding:12px;border-top:1px solid var(--line2)}

.mnav{display:none}
@media (max-width:899px){.qa a{flex-direction:column;align-items:flex-start;gap:8px}.qa b{font-size:14.5px}.lh h2 span{display:block}.top{padding:14px 16px}.wrap{padding:16px 14px 100px}.upd{padding:10px 16px}.qa{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}.row>label{padding-top:0}.gr2,.tl,.pick{grid-template-columns:1fr}
 .su{flex-direction:column}.su .l{width:auto;padding:28px 22px;gap:14px}.su .h{margin-top:6px;font-size:24px}.su .l .x{display:none}.su .r{padding:24px 18px}

</style></head><body>
<div id="rail"></div>
<div id="app"></div>

<div id="toast"></div>
<script>
const C = SJAPP, U = SJUI, CL = SJCLOUD, T = U.T, esc = U.esc, $ = s => document.querySelector(s);
const CO0 = { dpaName: 'Noh You Seok', dpaPhone: '+82-10-6588-7959', dpaEmail: 'nohys@sejulsm.com', sqEmail: 'sjsm@sejulsm.com' };
const PCS = ['선교', 'CCR', 'ECR', '선장실', '기관장실'];
let VIEW = 'home', SEC = '', UPD = false, SU = { s: 'choose', err: '', busy: false }, DEV = null, DEVERR = '', LST = null, TF = 'all', ERR = '';
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); };
const company = () => { let o = {}; try { o = JSON.parse(C.get('company') || '{}') || {}; } catch (e) {} Object.keys(CO0).forEach(k => { if (!o[k]) o[k] = CO0[k]; }); return o; };
const goTool = (tool, o) => 'tools/' + tool + '.html' + (o ? '?go=' + encodeURIComponent(JSON.stringify(o)) : '');
const clErr = e => { const s = String(e && e.message || e); return /office pin/.test(s) ? T('사무실 PIN이 맞지 않습니다', 'Wrong office PIN') : /not approved/.test(s) ? T('승인되지 않은 기기입니다', 'Device not approved') : /Failed to fetch|abort|NetworkError|Load failed/i.test(s) ? T('서버에 연결할 수 없습니다 — 인터넷을 확인하세요', 'Cannot reach the server — check the internet') : /does not exist|Could not find the function/i.test(s) ? T('서버 설정(SQL)이 아직 실행되지 않았습니다', 'Server setup (SQL) has not been run') : s; };
/* 이전 버전에서 쓰던 기기: 종류 자동 지정 */
if (!C.get('role')) { const m = CL.me(), v = C.get('vessel'); if (m && m.role && m.status !== 'none') C.set('role', m.role); else if (v === '__office') {} else if (v && C.get('pcname')) C.set('role', 'ship'); }

/* ================= 화면 고르기 ================= */
function route(){ const h = location.hash.replace(/^#/, ''); const [v, s] = h.split('/'); VIEW = ['settings', 'devices'].includes(v) ? v : 'home'; SEC = s || ''; }
function paint(){ route(); document.documentElement.lang = (C.get('lang') || 'ko');
  const role = U.role(), app = $('#app');
  if (!role || location.hash === '#setup' || SU.s === 'wait'){ $('#rail').innerHTML = ''; app.className = ''; app.innerHTML = setupHTML(); return; }
  if (VIEW === 'devices' && role !== 'office') VIEW = 'home';
  $('#rail').innerHTML = U.rail(VIEW === 'home' ? 'home' : VIEW, ''); U.syncPaint(); U.updPaint(); C.updBar(); pendBadge(); app.className = 'rl';
  const upd = '';
  app.innerHTML = upd + (VIEW === 'settings' ? settingsHTML() : VIEW === 'devices' ? devicesHTML() : role === 'office' ? fleetHTML() : todayHTML());
  if (VIEW === 'settings') setTimeout(() => { pushPaint(); prefsPaint(); }, 0); appBadge();
  if (VIEW === 'home' && typeof bgRefresh === 'function') setTimeout(bgRefresh, 800);
  if (SEC) setTimeout(() => { const el = document.getElementById('s-' + SEC); el && el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 40); }
function pendBadge(){ if (!DEV) return; const n = DEV.filter(d => d.status === 'pending').length; document.querySelectorAll('[data-sjpend]').forEach(b => { b.hidden = !n; b.textContent = n; }); }
const today = () => new Date().toLocaleDateString(C.get('lang') === 'en' ? 'en-GB' : 'ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

/* ================= 처음 설정 ================= */
const kindPick = () => { const k = SU.kind || C.get('kind') || U.kindGuess(); return `<div class="fld">${T('이 기기는', 'This device is a')}<div class="chips">${U.KINDS.map(([v, ic, ko, en]) => `<button data-sukind="${v}" class="${k === v ? 'on' : ''}">${ic} ${T(ko, en)}</button>`).join('')}</div><span style="font-weight:400;font-size:13px;color:var(--mut)">${T('기기 승인 화면에 표시됩니다 (자동으로 골라 두었습니다).', 'Shown on the device list (pre-selected automatically).')}</span></div>`; };
function setupHTML(){ const s = SU.s, off = s === 'office', lvl = s === 'choose' ? 1 : s === 'wait' ? 3 : 2, stc = n => n < lvl ? 'dn' : n === lvl ? 'on' : '';
  const left = `<div class="l"><div class="lg"><i>S</i><span><b>${T('SEJUL 선박관리', 'SEJUL Fleet Apps')}</b><small>SEJUL SHIP MANAGEMENT</small></span></div>
    <div class="h">${T('이 기기를<br>처음 설정합니다', 'Set up<br>this device')}</div><div class="d">${T('한 번만 하면 계획정비·위험성 관리 등 모든 도구에 똑같이 적용됩니다.', 'Once here, applied to every tool.')}</div>
    <div class="st ${stc(1)}"><i>${lvl > 1 ? '✓' : 1}</i>${T('어디서 쓰는 기기인가요', 'Where is it used')}</div><div class="st ${stc(2)}"><i>${lvl > 2 ? '✓' : 2}</i>${off ? T('사무실 PIN 입력', 'Office PIN') : T('선박과 PC 이름', 'Vessel and PC name')}</div><div class="st ${stc(3)}"><i>3</i>${off ? T('바로 시작', 'Start') : T('사무실 승인', 'Office approval')}</div>
    <div class="d x" style="margin-top:auto;font-size:12.5px;color:#8F9BB8">${T('기기 종류는 도구 안에서 바꿀 수 없습니다. 바꾸려면 [설정 › 기기 초기화] 후 다시 등록합니다.', 'Device type cannot be changed inside tools. Use Settings › Reset device.')}</div></div>`;
  let r = '';
  if (s === 'choose') r = `<div><div class="k">${T('1단계', 'Step 1')}</div><h1>${T('이 기기는 어디서 쓰나요?', 'Where is this device used?')}</h1></div><div class="pick">
