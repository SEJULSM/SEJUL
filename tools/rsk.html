<!DOCTYPE html>
<html lang="ko"><head><meta name="theme-color" content="#1F3864"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../favicon.png"><script src="../common.js"></script><script src="../ui.js"></script><script src="../cloud.js"></script><script src="../shell.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>위험성 관리 도구 RSK-P-01 | Sejul Ship Management</title>
<style>:root{
 --navy:#1F3864;--navy2:#2F5496;--pale:#D9E2F3;--bg:#F3F5F9;--card:#fff;--ink:#1d2433;--mute:#5d6778;--line:#d5dbe6;
 --gL:#2E7D32;--gLb:#E3F2E4;--gM:#B58100;--gMb:#FFF4CC;--gH:#D9560B;--gHb:#FFE2CC;--gX:#C62828;--gXb:#FDD9D9;
 --en:#2457A6;--ok:#2E7D32;--warn:#B58100;--err:#C62828;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}
.en{color:var(--en);font-family:Arial,'Malgun Gothic',sans-serif;font-size:.82em;font-weight:normal;margin-left:.35em}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* header */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.top .logo{font-weight:bold;font-size:19px}
.top .logo small{display:block;font-weight:normal;font-size:12px;opacity:.75;font-family:Arial}
.lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#cfdaf0;padding:6px 12px;font-weight:bold;font-size:14px}
.lang button.on{background:#FFC000;color:#1F3864}
.top .ves{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;font-weight:bold}
.top .ves.none{background:#C62828}
.nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;background:var(--navy2)}
.nav button{background:none;border:0;color:#dfe7f7;padding:11px 16px;font-size:16px;white-space:nowrap;border-bottom:4px solid transparent}
.nav button.on{color:#fff;font-weight:bold;border-bottom-color:#FFC000}
.nav button .en{color:#b9c9ea}
main{max-width:1720px;margin:0 auto;padding:18px 20px 90px}
.page-h{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.page-h h2{font-size:24px}
.page-h .sp{flex:1}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .num{background:var(--navy2);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.sub{color:var(--mute);font-size:14px}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f>label{font-weight:bold;font-size:15px}
.f>label .req{color:var(--err)}
input[type=text],input[type=date],input[type=datetime-local],input[type=time],input[type=number],select,textarea{width:100%;border:1.5px solid #c3cbd9;border-radius:8px;padding:9px 11px;background:#fff;font-size:16px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,84,150,.18)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{background:#f2f4f7;color:#444}
/* buttons */
.btn{border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);border-radius:9px;padding:9px 16px;font-weight:bold;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#eef2fa}
.btn.p{background:var(--navy2);color:#fff}
.btn.p:hover{background:var(--navy)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.r{background:#fff;border-color:var(--err);color:var(--err)}
.btn.rr{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{padding:14px 22px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .en{color:inherit;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}
.tile:hover{border-color:var(--navy2);box-shadow:0 4px 14px rgba(31,56,100,.12);transform:translateY(-1px)}
.tile .ic{font-size:30px}
.tile b{font-size:19px}
.tile .en{margin:0;font-size:14px}
.tile .sub{font-size:14px}
.tile.main{background:var(--navy2);border-color:var(--navy2);color:#fff}
.tile.main .en,.tile.main .sub{color:#d6e1f5}
/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left}
.choice.on{border-color:var(--navy2);background:#EEF3FC;box-shadow:inset 0 0 0 1px var(--navy2)}
.choice b{display:block}
.choice .sub{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #c3cbd9;background:#fff;border-radius:20px;padding:6px 14px;font-size:15px}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip.on .en{color:#d6e1f5}
.chip.x{padding-right:8px}
.chip.x span.del{margin-left:6px;color:var(--err);font-weight:bold}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
/* grades */
.gb{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 9px;font-weight:bold;font-size:14px;white-space:nowrap}
.gb.L{background:var(--gLb);color:var(--gL)}.gb.M{background:var(--gMb);color:var(--gM)}.gb.H{background:var(--gHb);color:var(--gH)}.gb.X{background:var(--gX);color:#fff}.gb.N{background:#eceff3;color:#888}
.st{display:inline-block;border-radius:6px;padding:2px 9px;font-size:13px;font-weight:bold;white-space:nowrap}
.st.draft{background:#eceff3;color:#555}.st.ok{background:var(--gLb);color:var(--gL)}.st.wait{background:var(--gMb);color:var(--gM)}.st.stop{background:var(--gX);color:#fff}.st.act{background:#DCE8FB;color:#1F4E9B}.st.closed{background:#e9e4f5;color:#5b3e99}
/* matrix picker */
.mx{display:inline-grid;grid-template-columns:auto repeat(5,48px);gap:3px;font-size:12px;user-select:none}
.mx .hd{display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:bold;text-align:center;line-height:1.15}
.mx .rh{justify-content:flex-end;padding-right:6px;white-space:nowrap}
.mx button{height:40px;border:2px solid transparent;border-radius:6px;font-weight:bold;font-size:15px;padding:0;opacity:.55}
.mx button:hover{opacity:1}
.mx button.L{background:#A5D6A7;color:#1B5E20}.mx button.M{background:#FFE082;color:#6d4c00}.mx button.H{background:#FFAB66;color:#7a2a00}.mx button.X{background:#EF5350;color:#fff}
.mx button.sel{opacity:1;border-color:#111;box-shadow:0 0 0 2px #fff inset;transform:scale(1.06)}
.mx.dim button{opacity:.3}
.rate-box{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rate-res{min-width:180px}
.rate-res .big{font-size:26px;font-weight:bold}
.rate-res .act{font-size:13px;color:var(--mute);margin-top:4px;max-width:260px}
/* hazard card */
.hz{border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;background:#fff;overflow:hidden}
.hz-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F5F7FB;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hz-h .n{font-weight:bold;font-size:17px}
.hz-h .t{flex:1;min-width:120px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hz-b{padding:14px}
.hz-sec{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.hz-sec>b{display:block;margin-bottom:8px;color:var(--navy2)}
.ctl{display:grid;grid-template-columns:170px 1fr 150px 36px;gap:8px;margin-bottom:8px}
.arrow{font-size:20px;color:var(--mute)}
/* stepper */
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps button{flex:1;min-width:150px;border:0;background:#E3E8F1;color:#4a5568;padding:11px 10px;border-radius:9px;font-weight:bold;text-align:left;font-size:15px}
.steps button .k{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy2);align-items:center;justify-content:center;margin-right:6px;font-size:13px}
.steps button.on{background:var(--navy2);color:#fff}
.steps button.done .k{background:var(--ok);color:#fff}
.steps button .en{color:inherit;opacity:.75}
.steps button.skip{opacity:.45;cursor:not-allowed;background:#EEF0F4;text-decoration:line-through}
.steps button.skip .sub{text-decoration:none;font-weight:normal}
.steps button{min-width:120px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:15;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.foot .in{max-width:1720px;width:100%;display:flex;gap:10px;align-items:center}
.foot .sp{flex:1}
/* alerts */
.al{border-radius:10px;padding:11px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;border-left:6px solid}
.al.err{background:#FDECEC;border-color:var(--err)}.al.warn{background:#FFF7DD;border-color:#E0A800}.al.ok{background:#E8F5E9;border-color:var(--ok)}.al.info{background:#EAF1FC;border-color:var(--navy2)}
.al .ic{font-size:18px;line-height:1.3}
.al .tx{flex:1}
.stop-banner{background:var(--err);color:#fff;border-radius:12px;padding:16px 18px;font-size:18px;font-weight:bold;margin-bottom:14px}
.stop-banner .sub{color:#ffe0e0;font-weight:normal;font-size:14px}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
table.t th{background:var(--navy2);color:#fff;padding:8px;text-align:left;font-weight:bold;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#F2F6FD}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.yn{display:inline-flex;border:1.5px solid #c3cbd9;border-radius:8px;overflow:hidden;flex:none}
.yn button{border:0;background:#fff;padding:6px 12px;font-weight:bold;font-size:14px;border-right:1px solid #c3cbd9}
.yn button:last-child{border-right:0}
.yn button.on.Y{background:var(--ok);color:#fff}.yn button.on.N{background:var(--err);color:#fff}.yn button.on.NA{background:#8a94a6;color:#fff}
.cl-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f5}
.cl-row .tx{flex:1}
.empty{text-align:center;color:var(--mute);padding:30px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{font-size:26px;display:block}
.toast{position:fixed;top:128px;right:20px;max-width:460px;background:#1d2433;color:#fff;padding:12px 20px;border-radius:10px;z-index:50;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{flex:1;font-size:19px}
.modal .mb{padding:16px 18px;overflow:auto}
.lib-h{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.lib-h .tx{flex:1}
details.crit summary{cursor:pointer;color:var(--navy2);font-weight:bold;font-size:14px;margin-top:6px}
table.crit{border-collapse:collapse;font-size:13px;margin-top:6px}
table.crit td,table.crit th{border:1px solid var(--line);padding:4px 8px;text-align:left}
table.crit th{background:var(--pale)}
.help h4{margin:18px 0 6px;color:var(--navy2);font-size:17px}
.help ol li,.help ul li{margin-bottom:5px}
#print{display:none}
@media (max-width:640px){
 .ctl{grid-template-columns:1fr}
 .mx{grid-template-columns:auto repeat(5,40px)}
 .page-h h2{font-size:20px}
 .grid.c2{grid-template-columns:1fr}
}
/* ===== print ===== */
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:10.5pt}
 .top,main,.foot,.toast,.modal-bg{display:none!important}
 #print{display:block}
}
.pd{font-family:'Malgun Gothic',Arial,sans-serif;color:#000;font-size:10.5pt}
.pd .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #1F3864;padding-bottom:5px;margin-bottom:8px}
.pd .ph .t1{font-size:17pt;font-weight:bold}
.pd .ph .t2{font-size:10pt;color:#2457A6;font-family:Arial}
.pd .ph .co{text-align:right;font-size:9pt}
.pd table{width:100%;border-collapse:collapse;margin-bottom:8px;page-break-inside:auto}
.pd tr{page-break-inside:avoid}
.pd th,.pd td{height:1.7em;border:1px solid #555;padding:3.5px 5px;vertical-align:top;font-size:9.5pt;text-align:left}
.pd th{background:#2F5496;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd td.k{background:#D9E2F3;font-weight:bold;width:17%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd .gb,.pd .st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd .sec{font-weight:bold;font-size:11pt;margin:10px 0 4px;color:#1F3864}
.pd .sig td{height:44px}
.pd .foot-p{border-top:1px solid #999;margin-top:10px;padding-top:3px;font-size:8pt;color:#555;display:flex;justify-content:space-between}
.pd .pb{page-break-before:always}
.pd .note{font-size:8.5pt;color:#333}
.pd .mxp{border-collapse:collapse;width:auto}
.pd .mxp td{width:26px;height:18px;text-align:center;font-size:8pt;padding:1px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.pd .pe{color:#2457A6;font-family:Arial,sans-serif;font-size:.88em;font-weight:normal}
.pd th .pe{color:#dbe6ff}
.tbmsolo table.tb td{height:8.2mm;vertical-align:middle}
.tbmsolo table.tb2 td{height:10mm}
.pkg textarea{width:100%;min-height:260px;font-family:Consolas,'Malgun Gothic',monospace;font-size:14px}
.stepbox{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f5}
.stepbox .k{background:var(--navy2);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.stepbox .tx{flex:1}
/* compact RA print (v1.7) */
.pd table.ri td{font-size:8.5pt;padding:2px 4px;height:auto}
.pd table.ri td.k{width:9%}
.pd table.rh{table-layout:fixed}
.pd table.rh th{font-size:8pt;padding:3px 4px;height:auto;vertical-align:middle}
.pd table.rh td{font-size:8pt;padding:2px 4px;height:auto;line-height:1.3}
.pd table.rh .note{font-size:7.3pt}
.pd table.rh .ctl-p{margin:0 0 1px;padding-left:1.1em;text-indent:-1.1em}
.pd table.rh .gc{text-align:center;font-size:7.5pt}
.pd table.rh .gc .gb{font-size:7.5pt;padding:1px 4px;display:inline-block;line-height:1.15;white-space:normal}
.pd table.rh thead{display:table-header-group}
.pd table.rb{page-break-inside:avoid;break-inside:avoid}
.pd table.rb td{font-size:8pt;padding:3px 5px;height:auto;vertical-align:top}
.pd table.rb td.sg{width:17.6%;position:relative;height:30mm}
.pd table.rb .sh{font-weight:bold;background:#D9E2F3;margin:-3px -5px 4px;padding:3px 5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd table.rb .sl{position:absolute;bottom:3px;left:5px;right:5px;border-top:1px dotted #888;font-size:7pt;color:#666;padding-top:1px}
.pd table.rb .mxp td{width:20px;height:14px;font-size:7pt}
.pd table.rb td.sg{height:19mm}
.pd table.rb .mxp td{width:17px;height:10px;font-size:6.5pt;padding:0}
.pd table.rb td{font-size:7.5pt;padding:2px 4px}
.pd table.ri{margin-bottom:5px}
.pd table.rh{margin-bottom:5px}
.pd .ph{margin-bottom:5px}
.pd .ph .t1{font-size:15pt}
.pd table.rh td{font-size:7.6pt;line-height:1.22;padding:1.5px 3px}
.pd table.rh .note{font-size:6.9pt}
.pd .foot-p{margin-top:4px}

.chip.on .sub{color:#dfe7f5}
span.btn{cursor:pointer}

.wgrp{border:1.5px solid #d6dbe4;border-radius:12px;padding:10px 12px;margin:8px 0 12px;background:#fafbfd}
.wgrp.ptw{border-color:#E36C09;background:#FFF8F0}
.wgh{font-weight:bold;margin-bottom:8px;font-size:15px}
.wgrp .choices{margin:0}
.ptwtag{margin-top:5px;font-size:12px;font-weight:bold;color:#B84E00;background:#FFE7D1;border-radius:6px;padding:2px 7px;display:inline-block}
.ptwtag.no{color:#555;background:#eceff3}
.se-hz{border:1.5px solid #d6dbe4;border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
.se-hz .row{gap:8px;flex-wrap:wrap}
.se-hz input[type=text],.se-hz textarea{width:100%}
.se-hz select{min-width:64px}
.modal:has(.se-hz){max-width:1250px}
.se-hz .row{display:flex;align-items:center;flex-wrap:nowrap}
.se-hz .row select{width:auto !important;flex:0 0 auto}
.se-hz .row input[type=text]{flex:1 1 auto;width:auto !important}
.se-hz .row .btn{flex:0 0 auto}
.se-hz .rate{flex-wrap:wrap}
.modal .row > .chips label.chip{user-select:none}

.fsst{cursor:pointer;font-size:13px;font-weight:bold;border-radius:8px;padding:6px 10px;margin-right:8px;white-space:nowrap}
.fsst.ok{background:#E8F5E9;color:#2E7D32}.fsst.ask{background:#FFB300;color:#3b2a00}.fsst.none,.fsst.err,.fsst.unsup{background:#E53935;color:#fff}
.siteSw{display:inline-flex;align-items:center;margin:6px 6px 6px 2px;background:rgba(255,255,255,.12);border-radius:20px;padding:2px;flex-shrink:0}
.siteSw button{padding:5px 12px !important;font-size:14px !important;border-radius:18px;border-bottom:0 !important;color:#dfe7f7}
.siteSw button.on{background:#FFC000;color:#1b2a4a !important;font-weight:bold}
.hzst{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:6px 14px;font-size:15px;font-weight:bold;white-space:nowrap}
.hzst.todo{background:#fff;border:2.5px solid #E36C09;color:#C55A00;cursor:pointer}
.hzst.todo:hover{background:#E36C09;color:#fff}
.hzst.done{background:#2E7D32;color:#fff;border:2.5px solid #2E7D32}
.hzst.need{background:#FDECEC;border:2.5px solid #C62828;color:#C62828}
details.crit summary{font-size:16px;padding:8px 14px;background:#EAF0FA;border:1.5px solid #9DB3DA;border-radius:8px;display:inline-block}
details.crit[open] summary{margin-bottom:8px}
.dqdec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.dqdec button{border:3px solid #c3cbd9;background:#fff;border-radius:12px;padding:16px 10px;font-size:19px;font-weight:bold;cursor:pointer;color:#4a5568}
.dqdec button .sub{display:block;font-weight:normal;font-size:13px;margin-top:4px}
.dqdec button.ok.on{background:#2E7D32;border-color:#2E7D32;color:#fff}
