<!DOCTYPE html>
<html lang="ko"><head><meta name="theme-color" content="#1F3864"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../sj2-favicon.png"><script src="../common.js"></script><script src="../ui.js"></script><script src="../cloud.js"></script><script src="../shell.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>위험성 관리 도구 RSK-P-01 | Sejul Ship Management</title>
<style>:root{
 --navy:var(--sj-navy,#14244A);--navy2:var(--sj-blu,#1F64B8);--pale:var(--sj-blu-bg,#E8F0FB);--bg:var(--sj-sf2,#F7F9FC);--card:var(--sj-sf,#FFFFFF);--ink:var(--sj-tx,#1A2233);--mute:var(--sj-tx2,#4A5568);--line:var(--sj-blu-bd,#B5CDEE);
 --gL:var(--sj-grn,#2FA36B);--gLb:var(--sj-grn-bg,#E6F5EC);--gM:var(--sj-amb,#E0A100);--gMb:var(--sj-amb-bg,#FFF6D6);--gH:var(--sj-org,#E07A1F);--gHb:var(--sj-org-bg,#FFF0E0);--gX:var(--sj-red,#D93636);--gXb:var(--sj-red-bg,#FDECEC);
 --en:var(--sj-blu,#1F64B8);--ok:var(--sj-grn,#2FA36B);--warn:var(--sj-amb,#E0A100);--err:var(--sj-red,#D93636);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}
.en{color:var(--en);font-family:Arial,'Malgun Gothic',sans-serif;font-size:.82em;font-weight:normal;margin-left:.35em}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* header */
.top{background:var(--navy);color:var(--sj-on,#FFFFFF);position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.top .logo{font-weight:bold;font-size:20px}
.top .logo small{display:block;font-weight:normal;font-size:12px;opacity:.75;font-family:Arial}
.lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--sj-on2,#DCE6F5);padding:6px 12px;font-weight:bold;font-size:14px}
.lang button.on{background:var(--sj-amb,#E0A100);color:var(--sj-tx,#1A2233)}
.top .ves{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;font-weight:bold}
.top .ves.none{background:var(--sj-red,#D93636)}
.nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;background:var(--navy2)}
.nav button{background:none;border:0;color:var(--sj-on2,#DCE6F5);padding:11px 16px;font-size:16px;white-space:nowrap;border-bottom:4px solid transparent}
.nav button.on{color:var(--sj-on,#FFFFFF);font-weight:bold;border-bottom-color:var(--sj-amb,#E0A100)}
.nav button .en{color:var(--sj-blu-fg,#1D5FAE)}
main{max-width:1720px;margin:0 auto;padding:18px 20px 90px}
.page-h{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.page-h h2{font-size:24px}
.page-h .sp{flex:1}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .num{background:var(--navy2);color:var(--sj-on,#FFFFFF);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.sub{color:var(--mute);font-size:14px}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f>label{font-weight:bold;font-size:16px}
.f>label .req{color:var(--err)}
input[type=text],input[type=date],input[type=datetime-local],input[type=time],input[type=number],select,textarea{width:100%;border:1.5px solid var(--sj-bd2,#C9D1DD);border-radius:8px;padding:9px 11px;background:var(--sj-sf,#FFFFFF);font-size:16px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,84,150,.18)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{background:var(--sj-sf2,#F7F9FC);color:var(--sj-tx,#1A2233)}
/* buttons */
.btn{border:1.5px solid var(--navy2);background:var(--sj-sf,#FFFFFF);color:var(--navy2);border-radius:9px;padding:9px 16px;font-weight:bold;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sj-blu-bg,#E8F0FB)}
.btn.p{background:var(--navy2);color:var(--sj-on,#FFFFFF)}
.btn.p:hover{background:var(--navy)}
.btn.g{background:var(--ok);border-color:var(--ok);color:var(--sj-on,#FFFFFF)}
.btn.r{background:var(--sj-sf,#FFFFFF);border-color:var(--err);color:var(--err)}
.btn.rr{background:var(--err);border-color:var(--err);color:var(--sj-on,#FFFFFF)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{padding:14px 22px;font-size:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .en{color:inherit;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--sj-sf,#FFFFFF);border:1.5px solid var(--line);border-radius:14px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}
.tile:hover{border-color:var(--navy2);box-shadow:0 4px 14px rgba(31,56,100,.12);transform:translateY(-1px)}
.tile .ic{font-size:30px}
.tile b{font-size:20px}
.tile .en{margin:0;font-size:14px}
.tile .sub{font-size:14px}
.tile.main{background:var(--navy2);border-color:var(--navy2);color:var(--sj-on,#FFFFFF)}
.tile.main .en,.tile.main .sub{color:var(--sj-on2,#DCE6F5)}
/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--sj-sf,#FFFFFF);border-radius:10px;padding:12px 14px;text-align:left}
.choice.on{border-color:var(--navy2);background:var(--sj-blu-bg,#E8F0FB);box-shadow:inset 0 0 0 1px var(--navy2)}
.choice b{display:block}
.choice .sub{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--sj-bd2,#C9D1DD);background:var(--sj-sf,#FFFFFF);border-radius:20px;padding:6px 14px;font-size:16px}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:var(--sj-on,#FFFFFF)}
.chip.on .en{color:var(--sj-on2,#DCE6F5)}
.chip.x{padding-right:8px}
.chip.x span.del{margin-left:6px;color:var(--err);font-weight:bold}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
/* grades */
.gb{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 9px;font-weight:bold;font-size:14px;white-space:nowrap}
.gb.L{background:var(--gLb);color:var(--gL)}.gb.M{background:var(--gMb);color:var(--gM)}.gb.H{background:var(--gHb);color:var(--gH)}.gb.X{background:var(--gX);color:var(--sj-on,#FFFFFF)}.gb.N{background:var(--sj-sf3,#EEF1F6);color:var(--sj-tx3,#6B7588)}
.st{display:inline-block;border-radius:6px;padding:2px 9px;font-size:13px;font-weight:bold;white-space:nowrap}
.st.draft{background:var(--sj-sf3,#EEF1F6);color:var(--sj-tx2,#4A5568)}.st.ok{background:var(--gLb);color:var(--gL)}.st.wait{background:var(--gMb);color:var(--gM)}.st.stop{background:var(--gX);color:var(--sj-on,#FFFFFF)}.st.act{background:var(--sj-blu-bg,#E8F0FB);color:var(--sj-blu-fg,#1D5FAE)}.st.closed{background:var(--sj-blu-bg,#E8F0FB);color:var(--sj-pur-fg,#6A3FB5)}
/* matrix picker */
.mx{display:inline-grid;grid-template-columns:auto repeat(5,48px);gap:3px;font-size:12px;user-select:none}
.mx .hd{display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:bold;text-align:center;line-height:1.15}
.mx .rh{justify-content:flex-end;padding-right:6px;white-space:nowrap}
.mx button{height:40px;border:2px solid transparent;border-radius:6px;font-weight:bold;font-size:16px;padding:0;opacity:.55}
.mx button:hover{opacity:1}
.mx button.L{background:var(--sj-grn-bd,#A9DCC0);color:var(--sj-grn-fg,#1E7A45)}.mx button.M{background:var(--sj-amb-bd,#EED68A);color:var(--sj-amb-fg,#8A6400)}.mx button.H{background:var(--sj-org-bd,#F6C99A);color:var(--sj-org-fg,#B85C00)}.mx button.X{background:var(--sj-red,#D93636);color:var(--sj-on,#FFFFFF)}
.mx button.sel{opacity:1;border-color:var(--sj-tx,#1A2233);box-shadow:0 0 0 2px var(--sj-bd,#E1E6EE) inset;transform:scale(1.06)}
.mx.dim button{opacity:.3}
.rate-box{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rate-res{min-width:180px}
.rate-res .big{font-size:26px;font-weight:bold}
.rate-res .act{font-size:13px;color:var(--mute);margin-top:4px;max-width:260px}
/* hazard card */
.hz{border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;background:var(--sj-sf,#FFFFFF);overflow:hidden}
.hz-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sj-sf2,#F7F9FC);border-bottom:1px solid var(--line);flex-wrap:wrap}
.hz-h .n{font-weight:bold;font-size:18px}
.hz-h .t{flex:1;min-width:120px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hz-b{padding:14px}
.hz-sec{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.hz-sec>b{display:block;margin-bottom:8px;color:var(--navy2)}
.ctl{display:grid;grid-template-columns:170px 1fr 150px 36px;gap:8px;margin-bottom:8px}
.arrow{font-size:20px;color:var(--mute)}
/* stepper */
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps button{flex:1;min-width:150px;border:0;background:var(--sj-blu-bg,#E8F0FB);color:var(--sj-tx2,#4A5568);padding:11px 10px;border-radius:9px;font-weight:bold;text-align:left;font-size:16px}
.steps button .k{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--sj-sf,#FFFFFF);color:var(--navy2);align-items:center;justify-content:center;margin-right:6px;font-size:13px}
.steps button.on{background:var(--navy2);color:var(--sj-on,#FFFFFF)}
.steps button.done .k{background:var(--ok);color:var(--sj-on,#FFFFFF)}
.steps button .en{color:inherit;opacity:.75}
.steps button.skip{opacity:.45;cursor:not-allowed;background:var(--sj-sf3,#EEF1F6);text-decoration:line-through}
.steps button.skip .sub{text-decoration:none;font-weight:normal}
.steps button{min-width:120px}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--sj-sf,#FFFFFF);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:15;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.foot .in{max-width:1720px;width:100%;display:flex;gap:10px;align-items:center}
.foot .sp{flex:1}
/* alerts */
.al{border-radius:10px;padding:11px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;border-left:6px solid}
.al.err{background:var(--sj-red-bg,#FDECEC);border-color:var(--err)}.al.warn{background:var(--sj-amb-bg,#FFF6D6);border-color:var(--sj-amb,#E0A100)}.al.ok{background:var(--sj-grn-bg,#E6F5EC);border-color:var(--ok)}.al.info{background:var(--sj-blu-bg,#E8F0FB);border-color:var(--navy2)}
.al .ic{font-size:18px;line-height:1.3}
.al .tx{flex:1}
.stop-banner{background:var(--err);color:var(--sj-on,#FFFFFF);border-radius:12px;padding:16px 18px;font-size:18px;font-weight:bold;margin-bottom:14px}
.stop-banner .sub{color:var(--sj-on2,#DCE6F5);font-weight:normal;font-size:14px}
/* tables */
table.t{width:100%;border-collapse:collapse;background:var(--sj-sf,#FFFFFF);font-size:16px}
table.t th{background:var(--navy2);color:var(--sj-on,#FFFFFF);padding:8px;text-align:left;font-weight:bold;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sj-blu-bg,#E8F0FB)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.yn{display:inline-flex;border:1.5px solid var(--sj-bd2,#C9D1DD);border-radius:8px;overflow:hidden;flex:none}
.yn button{border:0;background:var(--sj-sf,#FFFFFF);padding:6px 12px;font-weight:bold;font-size:14px;border-right:1px solid var(--sj-bd2,#C9D1DD)}
.yn button:last-child{border-right:0}
.yn button.on.Y{background:var(--ok);color:var(--sj-on,#FFFFFF)}.yn button.on.N{background:var(--err);color:var(--sj-on,#FFFFFF)}.yn button.on.NA{background:var(--sj-gry,#8A94A6);color:var(--sj-on,#FFFFFF)}
.cl-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--sj-bd,#E1E6EE)}
.cl-row .tx{flex:1}
.empty{text-align:center;color:var(--mute);padding:30px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi div{background:var(--sj-sf,#FFFFFF);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{font-size:26px;display:block}
.toast{position:fixed;top:128px;right:20px;max-width:460px;background:var(--sj-navy,#14244A);color:var(--sj-on,#FFFFFF);padding:12px 20px;border-radius:10px;z-index:50;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sj-sf,#FFFFFF);border-radius:14px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{flex:1;font-size:20px}
.modal .mb{padding:16px 18px;overflow:auto}
.lib-h{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.lib-h .tx{flex:1}
details.crit summary{cursor:pointer;color:var(--navy2);font-weight:bold;font-size:14px;margin-top:6px}
table.crit{border-collapse:collapse;font-size:13px;margin-top:6px}
table.crit td,table.crit th{border:1px solid var(--line);padding:4px 8px;text-align:left}
table.crit th{background:var(--pale)}
.help h4{margin:18px 0 6px;color:var(--navy2);font-size:18px}
.help ol li,.help ul li{margin-bottom:5px}
#print{display:none}
@media (max-width:640px){
 .ctl{grid-template-columns:1fr}
 .mx{grid-template-columns:auto repeat(5,40px)}
 .page-h h2{font-size:20px}
 .grid.c2{grid-template-columns:1fr}
}
/* ===== print ===== */
@media print{
 @page{size:A4;margin:12mm}
 body{background:var(--sj-sf,#FFFFFF);font-size:10.5pt}
 .top,main,.foot,.toast,.modal-bg{display:none!important}
 #print{display:block}
}
.pd{font-family:'Malgun Gothic',Arial,sans-serif;color:var(--sj-tx,#1A2233);font-size:10.5pt}
.pd .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--sj-blu,#1F64B8);padding-bottom:5px;margin-bottom:8px}
.pd .ph .t1{font-size:17pt;font-weight:bold}
.pd .ph .t2{font-size:10pt;color:var(--sj-blu-fg,#1D5FAE);font-family:Arial}
.pd .ph .co{text-align:right;font-size:9pt}
.pd table{width:100%;border-collapse:collapse;margin-bottom:8px;page-break-inside:auto}
.pd tr{page-break-inside:avoid}
.pd th,.pd td{height:1.7em;border:1px solid var(--sj-tx,#1A2233);padding:3.5px 5px;vertical-align:top;font-size:9.5pt;text-align:left}
.pd th{background:var(--sj-blu,#1F64B8);color:var(--sj-on,#FFFFFF);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd td.k{background:var(--sj-blu-bg,#E8F0FB);font-weight:bold;width:17%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd .gb,.pd .st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd .sec{font-weight:bold;font-size:11pt;margin:10px 0 4px;color:var(--sj-tx,#1A2233)}
.pd .sig td{height:44px}
.pd .foot-p{border-top:1px solid var(--sj-bd3,#9AA4B2);margin-top:10px;padding-top:3px;font-size:8pt;color:var(--sj-tx2,#4A5568);display:flex;justify-content:space-between}
.pd .pb{page-break-before:always}
.pd .note{font-size:8.5pt;color:var(--sj-tx,#1A2233)}
.pd .mxp{border-collapse:collapse;width:auto}
.pd .mxp td{width:26px;height:18px;text-align:center;font-size:8pt;padding:1px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.pd .pe{color:var(--sj-blu-fg,#1D5FAE);font-family:Arial,sans-serif;font-size:.88em;font-weight:normal}
.pd th .pe{color:var(--sj-on2,#DCE6F5)}
.tbmsolo table.tb td{height:8.2mm;vertical-align:middle}
.tbmsolo table.tb2 td{height:10mm}
.pkg textarea{width:100%;min-height:260px;font-family:Consolas,'Malgun Gothic',monospace;font-size:14px}
.stepbox{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sj-bd,#E1E6EE)}
.stepbox .k{background:var(--navy2);color:var(--sj-on,#FFFFFF);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.stepbox .tx{flex:1}
/* compact RA print (v1.7) */
.pd table.ri td{font-size:8.5pt;padding:2px 4px;height:auto}
.pd table.ri td.k{width:9%}
.pd table.rh{table-layout:fixed}
.pd table.rh th{font-size:8pt;padding:3px 4px;height:auto;vertical-align:middle}
.pd table.rh td{font-size:8pt;padding:2px 4px;height:auto;line-height:1.3}
.pd table.rh .note{font-size:7.3pt}
.pd table.rh .ctl-p{margin:0 0 1px;padding-left:1.1em;text-indent:-1.1em}
.pd table.rh .gc{text-align:center;font-size:7.5pt}
.pd table.rh .gc .gb{font-size:7.5pt;padding:1px 4px;display:inline-block;line-height:1.15;white-space:normal}
.pd table.rh thead{display:table-header-group}
.pd table.rb{page-break-inside:avoid;break-inside:avoid}
.pd table.rb td{font-size:8pt;padding:3px 5px;height:auto;vertical-align:top}
.pd table.rb td.sg{width:17.6%;position:relative;height:30mm}
.pd table.rb .sh{font-weight:bold;background:var(--sj-blu-bg,#E8F0FB);margin:-3px -5px 4px;padding:3px 5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd table.rb .sl{position:absolute;bottom:3px;left:5px;right:5px;border-top:1px dotted var(--sj-bd3,#9AA4B2);font-size:7pt;color:var(--sj-tx2,#4A5568);padding-top:1px}
.pd table.rb .mxp td{width:20px;height:14px;font-size:7pt}
.pd table.rb td.sg{height:19mm}
.pd table.rb .mxp td{width:17px;height:10px;font-size:6.5pt;padding:0}
.pd table.rb td{font-size:7.5pt;padding:2px 4px}
.pd table.ri{margin-bottom:5px}
.pd table.rh{margin-bottom:5px}
.pd .ph{margin-bottom:5px}
.pd .ph .t1{font-size:15pt}
.pd table.rh td{font-size:7.6pt;line-height:1.22;padding:1.5px 3px}
.pd table.rh .note{font-size:6.9pt}
.pd .foot-p{margin-top:4px}

.chip.on .sub{color:var(--sj-on2,#DCE6F5)}
span.btn{cursor:pointer}

.card.folded>*:not(h3){display:none}

/* 체크리스트 구역 + 모두 예 */

/* ===== SEJUL 디자인 기준값 (Design tokens) — 계획정비·위험성 관리·앱 홈 공통 =====
   밝게(기본) / 어둡게(data-sjt=dark) / 선교 야간(data-sjt=night, 붉은 빛) — 출력물은 항상 밝게.
   도구 원본의 색은 tokenize.py 로 var(--sj-…) 로 바뀌어 있음. 새 색을 직접 쓰지 말 것 (빌드 검사가 경고). */
:root{
 --sj-bg:#F3F5F9;--sj-sf:#FFFFFF;--sj-sf2:#F7F9FC;--sj-sf3:#EEF1F6;--sj-bd:#E1E6EE;--sj-bd2:#C9D1DD;--sj-bd3:#9AA4B2;
 --sj-tx:#1A2233;--sj-tx2:#4A5568;--sj-tx3:#6B7588;--sj-on:#FFFFFF;--sj-on2:#DCE6F5;--sj-inv:#2A3242;--sj-gry:#8A94A6;--sj-navy:#14244A;--sj-navy2:#22396B;
 --sj-red-fg:#C62828;--sj-red:#D93636;--sj-red-bg:#FDECEC;--sj-red-bd:#F4B8B8;
 --sj-org-fg:#B85C00;--sj-org:#E07A1F;--sj-org-bg:#FFF0E0;--sj-org-bd:#F6C99A;
 --sj-amb-fg:#8A6400;--sj-amb:#E0A100;--sj-amb-bg:#FFF6D6;--sj-amb-bd:#EED68A;
 --sj-grn-fg:#1E7A45;--sj-grn:#2FA36B;--sj-grn-bg:#E6F5EC;--sj-grn-bd:#A9DCC0;
 --sj-blu-fg:#1D5FAE;--sj-blu:#1F64B8;--sj-blu-bg:#E8F0FB;--sj-blu-bd:#B5CDEE;
 --sj-pur-fg:#6A3FB5;--sj-pur:#7C4DDB;--sj-pur-bg:#F1ECFB;--sj-pur-bd:#CDBDF0;
 --sj-brand:#0B5FB3;--sj-brand2:#1BA6EA;--sj-focus:#2F6FD6;
 --sj-sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sj-sh2:0 4px 14px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);--sj-sh3:0 18px 50px rgba(16,24,40,.22);
 --sj-r1:6px;--sj-r2:8px;--sj-r3:12px;--sj-r4:16px;
 --sj-f1:11px;--sj-f2:12px;--sj-f3:13px;--sj-f4:14px;--sj-f5:16px;--sj-f6:18px;--sj-f7:22px;--sj-f8:26px;
 --sj-g1:4px;--sj-g2:8px;--sj-g3:12px;--sj-g4:16px;--sj-g5:20px;--sj-g6:28px;
 --sj-scrim:rgba(15,23,42,.5);--sj-img:none;color-scheme:light;
 /* 도구 원본 변수 → 기준값 (계획정비) */
 --bg:var(--sj-bg);--panel:var(--sj-sf);--ink:var(--sj-tx);--sub:var(--sj-tx2);--mute:var(--sj-tx3);--line:var(--sj-bd);--line2:var(--sj-sf3);
 --pri:var(--sj-blu);--pri-d:var(--sj-navy2);--pri-l:var(--sj-blu-bg);
 --red:var(--sj-red-fg);--red-l:var(--sj-red-bg);--org:var(--sj-org-fg);--org-l:var(--sj-org-bg);--yel:var(--sj-amb-fg);--yel-l:var(--sj-amb-bg);
 --grn:var(--sj-grn-fg);--grn-l:var(--sj-grn-bg);--gry:var(--sj-tx3);--gry-l:var(--sj-sf3);--pur:var(--sj-pur-fg);--pur-l:var(--sj-pur-bg);
 --shadow:var(--sj-sh1);
 /* (위험성 관리) */
 --navy:var(--sj-navy);--navy2:var(--sj-navy2);--pale:var(--sj-blu-bg);--card:var(--sj-sf);
 --gL:var(--sj-grn-fg);--gLb:var(--sj-grn-bg);--gM:var(--sj-amb-fg);--gMb:var(--sj-amb-bg);--gH:var(--sj-org-fg);--gHb:var(--sj-org-bg);--gX:var(--sj-red-fg);--gXb:var(--sj-red-bg);

}

 --sj-amb-fg:#F5C451;--sj-amb:#C99400;--sj-amb-bg:#352B10;--sj-amb-bd:#66551E;
 --sj-grn-fg:#63D69A;--sj-grn:#279160;--sj-grn-bg:#12301F;--sj-grn-bd:#23573A;
 --sj-blu-fg:#86B9F7;--sj-blu:#2F74D0;--sj-blu-bg:#15273F;--sj-blu-bd:#284A73;

 --sj-brand:#4C9BEA;--sj-focus:#6AA8F2;
 --sj-sh1:0 1px 2px rgba(0,0,0,.4);--sj-sh2:0 4px 14px rgba(0,0,0,.45);--sj-sh3:0 18px 50px rgba(0,0,0,.6);--sj-scrim:rgba(0,0,0,.62);color-scheme:dark;

html[data-sjt=night]{
 --sj-bg:#000000;--sj-sf:#0A0202;--sj-sf2:#0F0303;--sj-sf3:#160505;--sj-bd:#2A0808;--sj-bd2:#3D0D0D;--sj-bd3:#5C1515;
 --sj-tx:#E04848;--sj-tx2:#BA3A3A;--sj-tx3:#9E3232;--sj-on:#FF9090;--sj-on2:#C04040;--sj-inv:#2A0808;--sj-gry:#6A1C1C;--sj-navy:#080101;--sj-navy2:#1C0505;
 --sj-red-fg:#FF5050;--sj-red:#9E1C1C;--sj-red-bg:#260606;--sj-red-bd:#5A1010;
 --sj-org-fg:#E8633A;--sj-org:#80240F;--sj-org-bg:#210704;--sj-org-bd:#4D150A;
 --sj-amb-fg:#E07A3C;--sj-amb:#7A2A10;--sj-amb-bg:#1F0804;--sj-amb-bd:#4A180A;
 --sj-grn-fg:#C04040;--sj-grn:#5A1414;--sj-grn-bg:#160404;--sj-grn-bd:#3A0C0C;
 --sj-blu-fg:#D05050;--sj-blu:#6A1616;--sj-blu-bg:#180404;--sj-blu-bd:#3F0E0E;
 --sj-pur-fg:#C84868;--sj-pur:#5E1428;--sj-pur-bg:#1A0408;--sj-pur-bd:#420C1A;
 --sj-brand:#C03030;--sj-brand2:#E04848;--sj-focus:#FF5050;
 --sj-sh1:none;--sj-sh2:none;--sj-sh3:0 0 0 1px #3D0D0D;--sj-scrim:rgba(0,0,0,.75);color-scheme:dark;
}
html[data-sjt=night] :is(img,video,canvas,svg image){filter:brightness(.55) sepia(1) hue-rotate(-45deg) saturate(2.5)}

/* 서명·도면 그림은 흰 바탕 유지 (읽기 쉽게) */

@media print{html[data-sjt]{
 --sj-bg:#FFFFFF;--sj-sf:#FFFFFF;--sj-sf2:#F7F9FC;--sj-sf3:#EEF1F6;--sj-bd:#C9D1DD;--sj-bd2:#9AA4B2;--sj-bd3:#6B7588;--sj-tx:#000000;--sj-tx2:#333B48;--sj-tx3:#555F70;--sj-on:#FFFFFF;--sj-on2:#DCE6F5;--sj-inv:#2A3242;--sj-gry:#8A94A6;--sj-navy:#14244A;--sj-navy2:#22396B;
 --sj-red-fg:#C62828;--sj-red:#D93636;--sj-red-bg:#FDECEC;--sj-red-bd:#F4B8B8;--sj-org-fg:#B85C00;--sj-org:#E07A1F;--sj-org-bg:#FFF0E0;--sj-org-bd:#F6C99A;--sj-amb-fg:#8A6400;--sj-amb:#E0A100;--sj-amb-bg:#FFF6D6;--sj-amb-bd:#EED68A;
 --sj-grn-fg:#1E7A45;--sj-grn:#2FA36B;--sj-grn-bg:#E6F5EC;--sj-grn-bd:#A9DCC0;--sj-blu-fg:#1D5FAE;--sj-blu:#1F64B8;--sj-blu-bg:#E8F0FB;--sj-blu-bd:#B5CDEE;--sj-pur-fg:#6A3FB5;--sj-pur:#7C4DDB;--sj-pur-bg:#F1ECFB;--sj-pur-bd:#CDBDF0;color-scheme:light}

/* ===== 기본 ===== */
html,body{background:var(--sj-bg);color:var(--sj-tx)}
::selection{background:var(--sj-blu-bd)}
a{color:var(--sj-blu-fg)}
hr{border:0;border-top:1px solid var(--sj-bd)}
:focus-visible{outline:2px solid var(--sj-focus)!important;outline-offset:2px}

/* ===== 공통 부품: 버튼 ===== (계획정비 .btn.pri/.grn/.danger/.red · 위험성 관리 .btn.p/.g/.r/.rr) */
html .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--sj-bd2);border-radius:var(--sj-r2);background:var(--sj-sf);color:var(--sj-tx);font-size:var(--sj-f4);font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap;box-shadow:var(--sj-sh1);transition:background .15s,border-color .15s,box-shadow .15s,transform .08s}
html .btn:hover{background:var(--sj-sf2);border-color:var(--sj-bd3)}
html .btn:active{transform:translateY(1px);box-shadow:none}
html .btn:disabled,html .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
html .btn :is(.en){color:inherit;opacity:.75}
html :is(.btn.pri,.btn.p){background:var(--sj-blu);border-color:var(--sj-blu);color:var(--sj-on)}
html :is(.btn.pri,.btn.p):hover{background:var(--sj-navy2);border-color:var(--sj-navy2)}
html :is(.btn.grn,.btn.g){background:var(--sj-grn);border-color:var(--sj-grn);color:var(--sj-on)}
html :is(.btn.grn,.btn.g):hover{filter:brightness(.93)}
html :is(.btn.red,.btn.rr){background:var(--sj-red);border-color:var(--sj-red);color:var(--sj-on)}
html :is(.btn.danger,.btn.r,.btn.del){background:var(--sj-sf);border-color:var(--sj-red-bd);color:var(--sj-red-fg)}
html :is(.btn.danger,.btn.r,.btn.del):hover{background:var(--sj-red-bg);border-color:var(--sj-red)}
html .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--sj-tx2)}
html .btn.ghost:hover{background:var(--sj-sf3)}
html .btn.sm{min-height:32px;padding:0 10px;font-size:var(--sj-f3);border-radius:var(--sj-r1)}
html .btn.xs{min-height:26px;padding:0 8px;font-size:var(--sj-f2);border-radius:var(--sj-r1);box-shadow:none}
html .btn.big{min-height:48px;padding:0 20px;font-size:var(--sj-f5);border-radius:var(--sj-r3)}
html .btn.blocked{background:var(--sj-org-bg);border-color:var(--sj-org);color:var(--sj-org-fg)}
html .btn.allyes{background:var(--sj-grn-bg);border-color:var(--sj-grn-bd);color:var(--sj-grn-fg)}

/* ===== 입력칸 ===== */
html :is(input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],input[type=datetime-local],input[type=password],input[type=search],input[type=email],input[type=tel],input:not([type]),select,textarea){border:1px solid var(--sj-bd2);border-radius:var(--sj-r2);background:var(--sj-sf);color:var(--sj-tx);font-size:var(--sj-f4);padding:8px 10px;min-height:40px;transition:border-color .15s,box-shadow .15s}
html textarea{min-height:72px;line-height:1.5}
html :is(input,select,textarea):hover:not(:disabled):not(:focus){border-color:var(--sj-bd3)}
html :is(input,select,textarea):focus{outline:none!important;border-color:var(--sj-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--sj-focus) 22%,transparent)}
html :is(input,select,textarea):disabled{background:var(--sj-sf3);color:var(--sj-tx3)}
html ::placeholder{color:var(--sj-tx3);opacity:1}
html input:is([type=checkbox],[type=radio]){accent-color:var(--sj-blu);width:18px;height:18px;min-height:0}
html label{color:inherit}

/* ===== 칩·뱃지 ===== */
html .chip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 13px;border:1px solid var(--sj-bd2);border-radius:999px;background:var(--sj-sf);color:var(--sj-tx2);font-size:var(--sj-f3);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
html .chip:hover{border-color:var(--sj-bd3);color:var(--sj-tx)}
html .chip.on{background:var(--sj-navy2);border-color:var(--sj-navy2);color:var(--sj-on);font-weight:600}
html .chip.on :is(.en,.sub){color:inherit;opacity:.8}
html .badge{display:inline-flex;align-items:center;gap:3px;border-radius:var(--sj-r1);padding:2px 7px;font-size:var(--sj-f2);font-weight:700;line-height:1.35;white-space:nowrap}

/* ===== 카드·표 ===== */
html .card{background:var(--sj-sf);border:1px solid var(--sj-bd);border-radius:var(--sj-r3);box-shadow:var(--sj-sh1)}
html .tw{background:var(--sj-sf);border:1px solid var(--sj-bd);border-radius:var(--sj-r3);box-shadow:var(--sj-sh1)}
html :is(table.g,table.t){border-collapse:separate;border-spacing:0;width:100%;background:var(--sj-sf);font-size:var(--sj-f4)}
html :is(table.g,table.t) th{background:var(--sj-sf2);color:var(--sj-tx2);font-size:var(--sj-f3);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--sj-bd);white-space:nowrap}
html :is(table.g,table.t) th :is(.en){color:var(--sj-tx3)}
html :is(table.g,table.t) td{padding:10px 12px;border-bottom:1px solid var(--sj-sf3);vertical-align:top;color:var(--sj-tx)}
html :is(table.g,table.t) tr:last-child td{border-bottom:0}
html :is(table.g tr.r,table.t tr.click):hover td{background:var(--sj-blu-bg)}
html table.g tr.sel td{background:var(--sj-blu-bg)}
html table.t{border:1px solid var(--sj-bd);border-radius:var(--sj-r2);overflow:hidden}

/* ===== 창(모달) ===== */
html .modal-bg{background:var(--sj-scrim);backdrop-filter:blur(2px)}
html .modal{background:var(--sj-sf);color:var(--sj-tx);border:1px solid var(--sj-bd);border-radius:var(--sj-r4);box-shadow:var(--sj-sh3);animation:sjdsPop .18s ease-out}
html .modal .mh{padding:16px 20px;border-bottom:1px solid var(--sj-bd);font-size:var(--sj-f6);font-weight:700;color:var(--sj-tx)}
html .modal .mh h3{font-size:var(--sj-f6)}
html .modal .mb{padding:18px 20px}
html .modal .mf{padding:12px 20px;border-top:1px solid var(--sj-bd);background:var(--sj-sf2);border-radius:0 0 var(--sj-r4) var(--sj-r4)}
@keyframes sjdsPop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

/* ===== 제목·글자 단계 ===== */
html h1{font-size:var(--sj-f8);font-weight:800;letter-spacing:-.3px;color:var(--sj-tx)}
html h2{font-size:var(--sj-f6);font-weight:700;color:var(--sj-tx)}
html h3{font-size:var(--sj-f5);font-weight:700}
html :is(.hsub,.sub){color:var(--sj-tx2)}

/* ===== 불러오는 중 뼈대 화면 ===== */
.sj-skel{display:grid;gap:14px;padding:4px 0}
.sj-skel i{display:block;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--sj-sf3) 0,var(--sj-bd) 40%,var(--sj-sf3) 80%) 0 0/200% 100%;animation:sjSk 1.2s linear infinite}
.sj-skel i.h{height:26px;width:40%}.sj-skel i.c{height:92px;border-radius:12px}.sj-skel i.s{width:70%}
@keyframes sjSk{to{background-position:-200% 0}}

/* ===== 저장 반응 ===== */
.sj-saved{position:fixed;right:18px;bottom:18px;z-index:9990;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--sj-inv);color:var(--sj-on);font-size:var(--sj-f3);font-weight:600;box-shadow:var(--sj-sh2);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.sj-saved.on{opacity:1;transform:none}
.sj-saved b{width:18px;height:18px;border-radius:50%;background:var(--sj-grn);display:inline-flex;align-items:center;justify-content:center}
@media (max-width:760px){.sj-saved{bottom:76px;right:50%;transform:translate(50%,8px)}.sj-saved.on{transform:translate(50%,0)}}

@media (prefers-reduced-motion:reduce){html *{animation:none!important;transition:none!important}}

/* 제목줄 동작 칸에 옮겨진 원본 단추 (class 없는 button) → 공통 단추 모양 */
html .sjx-act>button:not(.btn):not([class^=sj]){display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--sj-bd2);border-radius:var(--sj-r2);background:var(--sj-sf);color:var(--sj-tx);font-size:var(--sj-f4);font-weight:600;cursor:pointer;box-shadow:var(--sj-sh1)}
html .sjx-act>button.pri:not(.btn){background:var(--sj-blu);border-color:var(--sj-blu);color:var(--sj-on)}
html button:not([class]){color:inherit}
html .steps button .k{color:var(--sj-blu-fg)}
