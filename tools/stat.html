<script>
'use strict';
/* =====================================================================
   통계·분석 (사무실 전용) — 2026.11.26 1차
   · 부적합 탭: 감독 방선 보고서(내항·외항)의 판정·지적사항 통계
   · 종합 탭: 선박별 점수판 (현재 방선 자료만 · 결함·계획정비·NC는 해당 도구 완성 후 추가)
   · 자료: 방선 보고서 화면을 숨은 창(vst.html?statdata=1)으로 열어 이 기기 자료를 받음 → 그 창이 서버와 동기화하면 다시 받음
   ===================================================================== */
const UI = window.SJUI || null, APP = window.SJAPP || { get: () => null };
const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dot = s => String(s || '').replace(/-/g, '.');
const VES0 = ['KTS GOLD', 'KTS SILVER', 'KTS RED', 'KTS WHITE', 'KTS GREEN', 'KTS BLUE', 'SKY ROYAL', 'SUNNY QUEEN'];
const VES = () => (UI && UI.VES && UI.VES.length ? UI.VES : VES0);
const FOREIGN = ['SUNNY QUEEN', 'KTS WHITE'], isFV = v => FOREIGN.includes(String(v || '').toUpperCase().trim());
const TEAM = { S: ['안품', 'SQOT', 'var(--s1)'], T: ['공무', 'TST', 'var(--s2)'], M: ['해무', 'MAT', 'var(--s3)'] };
const TEAMF = { S: 'Marine (안품)', T: 'Technical (공무)' };
const role = () => (UI && UI.role ? UI.role() : (APP.get('role') || ''));
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : null;
const fmtP = v => v == null ? '—' : v + '%';

let DATA = null, ERR = '';
const S = { tab: 'nc',   /* 들어올 때는 항상 첫 탭(부적합) */ per: LS.get('sejul_stat_per') || '6', kind: LS.get('sejul_stat_kind') || 'all', ship: '' };

/* ---------- 자료 받기 ---------- */
function loadSrc() { ERR = ''; const f = $('#src'); f.src = 'vst.html?statdata=1&t=' + Date.now(); clearTimeout(loadSrc.t); loadSrc.t = setTimeout(() => { if (!DATA) { ERR = '방선 자료를 받지 못했습니다. 방선 보고서를 한 번 연 뒤 다시 시도하세요.'; render(); } }, 20000); }
addEventListener('message', e => { if (e.origin !== location.origin) return; const d = e.data; if (!d || d.kind !== 'SEJUL-STAT-VST') return; if (d.err) { ERR = d.err; render(); return; }
  const first = !DATA; DATA = d; paintSub(); if (first || !document.activeElement || !/SELECT/.test(document.activeElement.tagName)) render(); });
function paintSub() { const n = DATA ? DATA.reps.length : 0, t = DATA ? new Date(DATA.at) : null; $('#hsub').textContent = DATA ? `방선 보고서 ${n}건 · ${pad(t.getHours())}:${pad(t.getMinutes())} 기준 · 사무실 전용` : '자료를 불러오는 중…'; }

/* ---------- 기간·필터 ---------- */
const PER = [['3', '최근 3개월'], ['6', '최근 6개월'], ['12', '최근 12개월'], ['y', '올해'], ['all', '전체']];
function months() { const now = new Date(), cur = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`; let start;
  if (S.per === 'y') start = `${now.getFullYear()}-01`;
  else if (S.per === 'all') { const ds = (DATA ? DATA.reps : []).map(r => r.date).filter(Boolean).sort(); start = ds.length ? ds[0].slice(0, 7) : cur; }
  else { const d = new Date(now.getFullYear(), now.getMonth() - (+S.per - 1), 1); start = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  const out = []; let [y, m] = start.split('-').map(Number); for (let i = 0; i < 240; i++) { const k = `${y}-${pad(m)}`; out.push(k); if (k >= cur) break; m++; if (m > 12) { m = 1; y++; } } return out; }
function reps() { if (!DATA) return []; const M = months(), a = M[0], b = M[M.length - 1];
  return DATA.reps.filter(r => r.date && r.date.slice(0, 7) >= a && r.date.slice(0, 7) <= b && (S.kind === 'all' || (S.kind === 'f') === !!r.f) && (!S.ship || r.ship === S.ship)); }
function ships() { const L = VES().filter(v => S.kind === 'all' || (S.kind === 'f') === isFV(v)); return S.ship ? L.filter(v => v === S.ship) : L; }
/* 지적 1건 = 보고서 정보 + 지적 */
function finds(R) { const out = []; R.forEach(r => r.fnd.forEach((f, i) => out.push(Object.assign({ r, i, ship: r.ship, date: r.date, fx: r.f, ym: r.date.slice(0, 7) }, f)))); return out; }
function teamLabel(k, fx) { return fx ? (TEAMF[k] || k) : ((TEAM[k] || [k])[0]); }

/* ---------- 계산 ---------- */
function calc(R) { const F = finds(R), t0 = ymd();
  let y = 0, n = 0; R.forEach(r => r.parts.forEach(p => { y += p.y; n += p.no; }));
  const done = F.filter(f => f.done), dd = done.map(f => days(f.date, f.done)).filter(x => x >= 0), ontime = done.filter(f => !f.due || f.done <= f.due).length, lateOpen = F.filter(f => !f.done && f.due && f.due < t0).length;
  return { R, F, nRep: R.length, nDone: R.filter(r => r.done).length, y, n, rate: pct(n, y + n), nF: F.length, open: F.filter(f => !f.done).length, over: F.filter(f => !f.done && f.due && f.due < t0).length,
    avg: dd.length ? Math.round(dd.reduce((a, b) => a + b, 0) / dd.length * 10) / 10 : null, ontime: pct(ontime, done.length + lateOpen), nDoneF: done.length }; }
function repeatTop(F) { const M = new Map(); F.forEach(f => { const key = (f.fx ? 'F:' : 'D:') + (f.item || ('A' + f.area) || 'x'); if (!f.item && !f.area) return;
    const o = M.get(key) || { key, fx: f.fx, item: f.item, area: f.area, nm: f.item ? (f.it || f.item) : `구역 ${f.area} ${f.at || ''}`, part: f.part, n: 0, ships: new Set(), last: '' }; o.n++; o.ships.add(f.ship); if (f.date > o.last) o.last = f.date; M.set(key, o); });
  return [...M.values()].sort((a, b) => b.n - a.n || b.ships.size - a.ships.size || (b.last > a.last ? 1 : -1)); }
function byShip(R) { return ships().map(v => { const Rv = R.filter(r => r.ship === v), c = calc(Rv); return Object.assign({ ship: v, fx: isFV(v) }, c); }); }
/* 방선 이행: 내항 = 매월 1회 (방선한 달 수 ÷ 기간 개월 수) · 외항 = 6개월마다 1회 */
function compliance(v, R) { const M = months(), Rv = R.filter(r => r.ship === v); if (isFV(v)) { const need = Math.max(1, Math.ceil(M.length / 6)), got = Rv.length; return { got, need, p: Math.min(100, Math.round(got / need * 100)) }; }
  const got = new Set(Rv.map(r => r.date.slice(0, 7))).size; return { got, need: M.length, p: Math.min(100, Math.round(got / M.length * 100)) }; }

/* ---------- 그림: 월별 지적 (팀별 누적 막대) ---------- */
function trendSVG(F) { const M = months(), keys = ['S', 'T', 'M'].filter(k => S.kind !== 'f' || k !== 'M');
  const data = M.map(m => { const o = { m }; keys.forEach(k => o[k] = F.filter(f => f.ym === m && f.part === k).length); o.x = F.filter(f => f.ym === m && !keys.includes(f.part)).length; o.t = keys.reduce((a, k) => a + o[k], 0) + o.x; return o; });
  const max = Math.max(4, ...data.map(d => d.t)), step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10, top = Math.ceil(max / step) * step;
  const W = 640, H = 220, L = 30, B = 26, T = 8, w = (W - L) / data.length, bw = Math.min(34, w * 0.6), sy = v => H - B - v / top * (H - B - T);
  let g = ''; for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}</text>`;

  h += `<div class="card" id="sec-open" style="margin-top:12px"><h2>미조치 지적 <span class="en">Open findings</span><span class="sp"></span><span class="small mut">${O.length}건</span></h2><p class="sub">조치기한 순 · 줄을 누르면 방선 보고서가 열립니다 (D.P 승인된 연장기한 반영)</p>
    ${O.length ? `<div class="tw"><table class="t"><tr><th>선박</th><th class="n">방선일</th><th>항목</th><th>지적 내용</th><th class="n">조치기한</th><th class="n">경과</th></tr>${O.slice(0, 60).map(f => { const od = f.due && f.due < t0 ? days(f.due, t0) : 0;
      return `<tr ${goRep(f.r.id)}><td><b>${esc(f.ship)}</b>${f.fx && f.ty ? ` <span class="tag ${f.ty === 'NC' ? 'err' : 'warn'}">${f.ty === 'NC' ? 'NC' : 'Defect'}</span>` : ''}</td><td class="n small">${dot(f.date).slice(2)}</td><td class="small">${f.item ? `<span class="no">${esc(f.item)}</span>${esc(f.it)}` : f.area ? `구역 ${esc(f.area)} ${esc(f.at)}` : '—'}</td><td class="small">${esc(f.title || f.desc || '').slice(0, 80)}</td><td class="n small">${f.due ? dot(f.due).slice(2) : '—'}</td><td class="n">${od ? `<span class="tag err">+${od}일</span>` : '<span class="mut small">기한 전</span>'}</td></tr>`; }).join('')}</table></div>${O.length > 60 ? `<p class="small mut">외 ${O.length - 60}건 — 엑셀로 전체 목록을 받으세요</p>` : ''}` : '<div class="empty">미조치 지적이 없습니다 👍</div>'}</div>`;
  return h; }

function viewAll() { const R = reps(), B = byShip(R);
  let h = prHead('선박별 종합 점수판 · Fleet scorecard');
  h += `<div class="note i noprint">지금은 <b>감독 방선 자료만</b> 반영합니다. 결함·계획정비·부적합(NC)은 해당 도구를 만든 뒤 이 표에 열이 추가됩니다.</div>`;
  const row = b => { const cp = compliance(b.ship, R), okr = b.rate == null ? null : Math.round((100 - b.rate) * 10) / 10, ot = b.ontime;
    const parts = [[cp.p, 0.3], [okr, 0.3], [ot, 0.4]].filter(x => x[0] != null), w = parts.reduce((a, x) => a + x[1], 0), sc = b.nRep && w ? Math.round(parts.reduce((a, x) => a + x[0] * x[1], 0) / w) : null;
    const cls = sc == null ? '' : sc >= 90 ? 'g' : sc >= 75 ? 'y' : 'r';
    return { b, cp, okr, ot, sc, cls }; };
  const L = B.map(row).sort((a, b) => (b.sc == null ? -1 : b.sc) - (a.sc == null ? -1 : a.sc));
  h += `<div class="card"><h2>선박별 점수판 <span class="en">Scorecard</span></h2><p class="sub">방선 점수 = 방선 이행률 30% + 판정 적합률 30% + 기한 내 조치율 40% (자료가 없는 항목은 빼고 계산) · 90 이상 양호, 75 미만 주의</p>
    <div class="tw"><table class="t"><tr><th>선박</th><th class="n">방선 점수</th><th class="n">방선 이행</th><th class="n">판정 적합률</th><th class="n">기한 내 조치율</th><th class="n">미조치</th><th class="n">기한 초과</th><th class="n ph">결함</th><th class="n ph">계획정비</th><th class="n ph">NC</th></tr>
    ${L.map(({ b, cp, okr, ot, sc, cls }) => `<tr data-ship="${esc(b.ship)}" style="cursor:pointer"><td><b>${esc(b.ship)}</b> ${b.fx ? '<span class="tag f">외항</span>' : '<span class="tag">내항</span>'}</td><td class="n"><span class="sc ${cls}">${sc == null ? '—' : sc}</span></td>
      <td class="n">${cp.p}% <span class="mut small">(${cp.got}/${cp.need}${b.fx ? '회' : '개월'})</span></td><td class="n">${fmtP(okr)}</td><td class="n">${fmtP(ot)}</td><td class="n">${b.open || '<span class="mut">0</span>'}</td><td class="n">${b.over ? `<span class="tag err">${b.over}</span>` : '<span class="mut">0</span>'}</td><td class="n ph">준비 중</td><td class="n ph">준비 중</td><td class="n ph">준비 중</td></tr>`).join('')}</table></div>
    <p class="small mut" style="margin:8px 0 0">방선 이행: 내항선은 매월 방선(방선한 달 ÷ 기간 개월 수), 외항선은 6개월마다 정식 방선(방선 수 ÷ 필요 횟수). 판정 적합률 = 100 − 판정 부적합률. 기한 내 조치율 = 기한 안에 조치 완료 ÷ (조치 완료 + 기한 지난 미조치) — 기한을 넘긴 미조치도 감점됩니다.</p></div>`;
  /* 경영검토 요약 */
  const c = calc(R), top = repeatTop(c.F).filter(t => t.ships.size >= 2).slice(0, 5), worst = L.filter(x => x.sc != null && x.sc < 75).map(x => x.b.ship);
  h += `<div class="card"><h2>경영검토 요약 <span class="en">Management review</span></h2><p class="sub">출력해서 경영검토·선대 회의 자료로 쓸 수 있습니다</p>
    <ul style="margin:4px 0 0;padding-left:20px;line-height:1.9">
    <li>기간 중 감독 방선 <b>${c.nRep}건</b> (완료 ${c.nDone}), 지적 <b>${c.nF}건</b> — 방선 1회당 ${c.nRep ? Math.round(c.nF / c.nRep * 10) / 10 : 0}건, 판정 부적합률 ${fmtP(c.rate)}</li>
    <li>미조치 <b>${c.open}건</b>${c.over ? `, 그중 기한 초과 <b style="color:var(--err)">${c.over}건</b>` : ' (기한 초과 없음)'} · 기한 내 조치율 ${fmtP(c.ontime)} · 평균 조치 ${c.avg == null ? '—' : c.avg + '일'}</li>
    <li>여러 선박에서 반복된 지적: ${top.length ? top.map(t => `<b>${esc(t.item || '구역 ' + t.area)}</b> ${esc(t.item ? t.nm : '')} (${t.ships.size}척·${t.n}건)`).join(', ') : '없음'}</li>
    <li>방선 점수 75점 미만 선박: ${worst.length ? worst.map(v => `<b>${esc(v)}</b>`).join(', ') : '없음'}</li></ul></div>`;
  return h; }

function render() { $('#tabs').innerHTML = tabsHTML(); $('#ptabs').innerHTML = tabsHTML();
  if (role() && role() !== 'office') { $('#app').innerHTML = `<div class="card empty">통계·분석은 <b>사무실 전용</b>입니다.</div>`; return; }
  if (!DATA) { $('#app').innerHTML = ERR ? `<div class="card empty">${esc(ERR)}<br><br><button class="lnk" id="bTry">다시 시도</button></div>` : `<div class="load"><div class="spin"></div>방선 자료를 불러오는 중…</div>`; const b = $('#bTry'); if (b) b.onclick = () => { $('#app').innerHTML = '<div class="load"><div class="spin"></div>다시 불러오는 중…</div>'; loadSrc(); }; return; }
  if (!['nc', 'all'].includes(S.tab)) S.tab = 'nc';
  $('#app').innerHTML = PH() ? fltPhone() + (S.tab === 'all' ? viewAllm() : viewNCm()) : fltHTML() + (S.tab === 'all' ? viewAll() : viewNC());
  bind(); }
function bind() { $$('[data-tab]').forEach(b => b.onclick = () => { if (b.disabled) return; S.tab = b.dataset.tab; LS.set('sejul_stat_tab', S.tab); render(); scrollTo(0, 0); });
  $$('[data-per]').forEach(b => b.onclick = () => { S.per = b.dataset.per; LS.set('sejul_stat_per', S.per); render(); });
  $$('[data-kind]').forEach(b => b.onclick = () => { S.kind = b.dataset.kind; LS.set('sejul_stat_kind', S.kind); if (S.ship && (S.kind === 'f') !== isFV(S.ship) && S.kind !== 'all') S.ship = ''; render(); });
  const fs = $('#fship'); if (fs) fs.onchange = () => { S.ship = fs.value; render(); };
  const fp = $('#fper'); if (fp) fp.onchange = () => { S.per = fp.value; LS.set('sejul_stat_per', S.per); render(); };
  const fk = $('#fkind'); if (fk) fk.onchange = () => { S.kind = fk.value; LS.set('sejul_stat_kind', S.kind); if (S.ship && S.kind !== 'all' && (S.kind === 'f') !== isFV(S.ship)) S.ship = ''; render(); };
  $$('[data-ship]').forEach(r => r.onclick = () => { S.ship = S.ship === r.dataset.ship ? '' : r.dataset.ship; render(); scrollTo(0, 0); });
  $$('[data-go]').forEach(r => r.onclick = () => { location.href = 'vst.html#/r/' + r.dataset.go; });
  $$('[data-jump]').forEach(k => { const f = () => { const t = document.getElementById(k.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; k.onclick = f; k.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  bindTrend(); }

/* ---------- 엑셀 (저장 위치 고르기) ---------- */
function loadXLSX() { return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = '../lib/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('엑셀 모듈을 불러오지 못했습니다')); document.head.appendChild(s); }); }
async function saveFile(blob, name) {
  if (window.showSaveFilePicker) { try { const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] }); const w = await h.createWritable(); await w.write(blob); await w.close(); toast('저장했습니다 · Saved'); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { const f = new File([blob], name, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('다운로드 폴더에 저장했습니다'); }
async function exportXL() { if (!DATA) return; try { await loadXLSX(); } catch (e) { toast(e.message); return; }
  const R = reps(), c = calc(R), M = months(), wb = XLSX.utils.book_new(), add = (n, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), n);
  add('조건', [['세줄선박관리 통계·분석 — 감독 방선'], ['기간', `${M[0]} ~ ${M[M.length - 1]}`], ['구분', { all: '전체', d: '내항선', f: '외항선' }[S.kind]], ['선박', S.ship || '전체'], ['만든 날', ymd()], [], ['방선 보고서', c.nRep], ['판정 부적합률(%)', c.rate], ['지적', c.nF], ['미조치', c.open], ['기한 초과', c.over], ['평균 조치(일)', c.avg], ['기한 내 조치율(%)', c.ontime]]);
  add('지적 목록', [['선박', '구분', '방선일', '팀', '항목', '항목명', '구역', 'NC/Defect', '보고서 번호', '지적 제목', '지적 내용', '조치기한', '조치완료일', '확인일', '상태'], ...c.F.map(f => [f.ship, f.fx ? '외항' : '내항', f.date, f.part ? teamLabel(f.part, f.fx) : '', f.item, f.it, f.area ? `${f.area} ${f.at}` : '', f.ty === 'DF' ? 'Defect' : f.ty, f.rno, f.title, f.desc, f.due, f.done, f.ver, f.done ? '조치 완료' : f.over ? '기한 초과' : '미조치'])]);
  add('선박 비교', [['선박', '구분', '방선', '완료', '판정 부적합률(%)', '지적', '미조치', '기한 초과', '평균 조치(일)', '기한 내 조치율(%)', '방선 이행(%)'], ...byShip(R).map(b => [b.ship, b.fx ? '외항' : '내항', b.nRep, b.nDone, b.rate, b.nF, b.open, b.over, b.avg, b.ontime, compliance(b.ship, R).p])]);
  add('반복 지적', [['항목', '항목명', '구분', '팀', '지적 수', '선박 수', '선박', '최근'], ...repeatTop(c.F).map(t => [t.item || '구역 ' + t.area, t.nm, t.fx ? '외항' : '내항', t.part ? teamLabel(t.part, t.fx) : '', t.n, t.ships.size, [...t.ships].join(', '), t.last])]);
  const keys = ['S', 'T', 'M']; add('월별', [['월', ...keys.map(k => TEAM[k][0]), '합계'], ...M.map(m => { const v = keys.map(k => c.F.filter(f => f.ym === m && f.part === k).length); return [m, ...v, c.F.filter(f => f.ym === m).length]; })]);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await saveFile(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `방선통계_${S.ship ? S.ship.replace(/\s+/g, '') + '_' : ''}${ymd().replace(/-/g, '')}.xlsx`); }
function toast(m) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1A2233;color:#fff;padding:10px 16px;border-radius:12px;z-index:300;font-weight:700;font-size:14px'; document.body.appendChild(t); } t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); }

/* ---------- 시작 ---------- */
(function boot() {
  try { if (UI && UI.css) { const st = document.createElement('style'); st.textContent = UI.css; document.head.appendChild(st); const w = document.createElement('div');
      if (UI.rail) { w.innerHTML = UI.rail('stat', '../'); document.body.classList.add('rail', 'sjm-on'); }
      [...w.children].forEach(x => document.body.appendChild(x)); UI.syncPaint && UI.syncPaint(); try { UI.updPaint && UI.updPaint(); } catch (e) { } try { UI.inb && UI.inb.paint && UI.inb.paint(); } catch (e) { } } } catch (e) { console.warn('frame', e); }
  try { if (UI && UI.ic && UI.IC_ST) $('#sjtId i').innerHTML = UI.ic(UI.IC_ST, 17); } catch (e) { }
  /* PC: 다른 도구와 같은 [● 동기화됨] 버튼 — 숨은 방선 화면의 서버 연결로 지금 동기화 → 새 자료로 다시 계산 */
  if (UI && UI.topSync) { $('#syncSlot').outerHTML = UI.topSync(); $('#bRe').classList.add('noPC'); }
  const SRC = () => { try { return $('#src').contentWindow; } catch (e) { return null; } };
  window.SJ_TOPCLOUD = () => { const w = SRC(); return w && w.SJCLOUD && w.SJCLOUD.A ? w.SJCLOUD : null; };
  window.SJ_TOPSYNC = async () => { const w = SRC(), Cl = w && w.SJCLOUD; if (!Cl || !Cl.A) { DATA = null; render(); loadSrc(); return 0; } const n = await (Cl.syncWait ? Cl.syncWait(Cl.A) : Cl.sync(Cl.A, false)); try { w.statPost && w.statPost(); } catch (e) { } return n || 0; };
  $('#bXl').onclick = exportXL; $('#bPr').onclick = () => print();
  render(); if (!role() || role() === 'office') loadSrc();
  let pw = PH(); addEventListener('resize', () => { if (PH() !== pw) { pw = PH(); render(); } });
})();
</script>
