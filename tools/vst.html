<style>
@font-face{font-family:'Pretendard';src:url(../fonts/Pretendard-Regular.subset.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Pretendard';src:url(../fonts/Pretendard-Bold.subset.woff2) format('woff2');font-weight:700}
:root{--navy:#14244A;--navy2:#1F3864;--gold:#E0A100;--bg:#F4F6FA;--card:#fff;--ink:#1A2233;--mut:#5B6578;--line:#DDE3EC;--blu:#1F64B8;--bluBg:#E8F0FB;
 --ok:#2FA36B;--okBg:#E6F5EC;--warn:#E0A100;--warnBg:#FFF6D6;--err:#D93636;--errBg:#FDECEC;--na:#8A94A6;--naBg:#EEF1F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.en{color:var(--mut);font-size:.82em;font-weight:400;margin-left:.3em}
/* 머리글 */
.hd{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:10px 14px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.hd a.home{color:#fff;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);text-decoration:none;flex:none}
.hd .tt{flex:1;min-width:0}
.hd .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:14px}
.sd{width:9px;height:9px;border-radius:50%;background:#8A94A6;display:inline-block}
.sd.ok{background:#3DDC84}.sd.warn{background:var(--gold)}.sd.err{background:#FF6B6B}
/* 탭 */
.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
.tabs button{flex:1;min-width:64px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px 8px;font-size:15px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button small{display:block;font-size:11px;font-weight:400}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.tabs .ck{color:var(--ok)}
main{max-width:860px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--mut);font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.g{background:var(--gold);border-color:var(--gold);color:#1A2233}
.btn.r{color:var(--err);border-color:#F3C4C4}
.btn.s{min-height:38px;padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
label.f{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid #C9D1DD;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
textarea.i{min-height:84px;resize:vertical}
/* 목록 */
.rep{display:block;text-decoration:none;color:inherit}
.rep .top{display:flex;gap:8px;align-items:baseline}
.rep .top b{font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--naBg);color:var(--mut);font-weight:700}
.chip.ok{background:var(--okBg);color:#1E7A4E}.chip.warn{background:var(--warnBg);color:#8A6400}.chip.err{background:var(--errBg);color:var(--err)}.chip.q{background:var(--bluBg);color:var(--blu)}
/* 점검 항목 */
.prog{height:8px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok)}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.it.done{border-left:5px solid var(--ok)}.it.bad{border-left:5px solid var(--err)}.it.na{border-left:5px solid var(--na)}
.it .nh{display:flex;gap:8px;align-items:flex-start}
.it .no{flex:none;background:var(--navy);color:#fff;border-radius:8px;font-weight:700;font-size:14px;padding:2px 8px;margin-top:1px}
.it .tx{flex:1;min-width:0}
.it .tx b{font-size:16px}
.it .tx .pt{font-size:14px;color:#33405A;margin-top:2px}
.it .tx .pe{font-size:13px;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut)}
.tag.ph{border-color:#F0C46A;color:#8A6400;background:var(--warnBg)}
.tag.miss{border-color:#F3C4C4;color:var(--err);background:var(--errBg)}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.yn button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;color:var(--mut)}
.yn button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.n.on{background:var(--err);border-color:var(--err);color:#fff}
.yn button.x.on{background:var(--na);border-color:var(--na);color:#fff}
.yn button small{font-size:12px;font-weight:600;margin-left:3px}
.act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.tw{position:relative;display:inline-block}
.tw .dx{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--err);color:#fff;font-size:15px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.th{padding-top:6px}
.memo{margin-top:8px;font-size:14px;background:#F7F9FC;border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.qh{background:var(--bluBg);color:var(--blu);border-radius:12px;padding:10px 12px;font-weight:700;margin:16px 0 10px}
.qh small{display:block;font-weight:400;font-size:13px}
.lock{background:var(--okBg);border:1px solid #BFE5CF;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.sigbox{display:flex;gap:12px;align-items:center}
.sigbox img{height:56px;max-width:180px;background:#fff;border:1px solid var(--line);border-radius:8px}
.issues{background:var(--errBg);border:1px solid #F3C4C4;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.issues li{margin:2px 0}
/* 지적사항 */
.fd{display:flex;gap:10px}
.fd .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--err);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
/* 하단 고정 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar .btn{flex:1}
/* 모달 */
.mb{position:fixed;inset:0;z-index:1000;background:rgba(10,18,36,.55);display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mb{align-items:center}.md{border-radius:18px}}
.md h3{font-size:18px;display:flex;align-items:center;gap:8px}
.md .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mut)}
canvas.pad{width:100%;height:220px;border:2px dashed #C9D1DD;border-radius:12px;background:#FCFDFE;touch-action:none;display:block}
.toast{z-index:1100!important;position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translateX(-50%);z-index:300;background:#1A2233;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.seg{display:flex;border:1px solid #C9D1DD;border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:11px 8px;font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--mut);font-weight:600}
/* PC: 왼쪽 메뉴 */
@media(min-width:900px){body.rail{padding-left:var(--sjr-w,248px)}body.rail .bar{left:var(--sjr-w,248px)}}
body.bnav main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.sjb a,.sjr a{text-decoration:none}
body.bnav .pvbar{top:0}
@media print{.sjb{display:none!important}}
/* ============ 출력 (서식 SMM-3C-01F R-4) ============ */
.pv{background:#E6E9EF;padding:12px 0 40px;overflow-x:auto}
.pvbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}
.doc{font-family:'Pretendard','Malgun Gothic',sans-serif;color:#000;font-size:11pt;line-height:1.35}
.pg{width:210mm;min-height:297mm;background:#fff;margin:0 auto 12px;padding:12mm 12mm 18mm;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pg .pf{position:absolute;left:12mm;right:12mm;bottom:7mm;display:flex;justify-content:space-between;font-size:9pt;font-style:italic;color:#333}
.doc h1{font-size:16pt;text-align:center;margin:0}
.doc .sub{text-align:center;font-size:12pt;font-weight:700;margin:0 0 6px}
.doc .sh{font-size:12pt;font-weight:700;margin:8px 0 4px}
.doc .sh .e{color:#1F3A8A}
.doc table{width:100%;border-collapse:collapse;table-layout:fixed}
.doc td,.doc th{border:1px solid #000;padding:2px 5px;vertical-align:middle;font-size:11pt;word-break:keep-all;overflow-wrap:anywhere}
.doc th{background:#D9E1EE;font-weight:700;text-align:center}
.doc .lb{background:#E7ECF4;font-weight:700}
.doc .lb small,.doc th small{display:block;font-weight:400;color:#555;font-size:10pt}
.doc .c{text-align:center}
.doc .g{color:#555;font-size:10pt}
.doc .mm{font-size:10pt;font-style:italic;color:#1F3A8A}
.doc .qr td{background:#F1F4F9;font-weight:700}
.doc .qr .e{color:#1F3A8A;font-weight:700}
.doc .sg img{height:13mm;max-width:100%;display:block;margin:0 auto}
.doc .ph{height:52mm;text-align:center;color:#777}
.doc .ph img{max-width:100%;max-height:50mm;object-fit:contain;display:block;margin:0 auto}
.doc .cap{background:#F1F4F9;font-weight:700;font-size:10.5pt}
.doc tr{break-inside:avoid}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff!important;padding:0!important}
 body>*:not(#print){display:none!important}
 #print{display:block!important;background:#fff;padding:0}
 .pvbar{display:none!important}
 .pg{margin:0;box-shadow:none;break-after:page;width:210mm;min-height:297mm;height:auto}
 .pg:last-child{break-after:auto}
 .pv{zoom:1!important;padding:0;background:#fff}
}

<script>
'use strict';
/* =====================================================================
   감독 방선 보고서 (내항선) — SMM-3C-01F R-4 / 2026.11.18
   · 안품(S)·공무(T)·해무(M) 감독이 각자 파트를 점검·서명 → 하나의 보고서로 합쳐짐
   · 자료: 이 기기 IndexedDB(sejul_vst) + SEJUL 서버 동기화(도구 이름 'vst') + 파일 내보내기/가져오기
   · 합치기: 항목·지적사항·서명 단위로 '나중에 고친 쪽' 우선 (u = 고친 시각)
   ===================================================================== */
const APP = window.SJAPP || { get: () => null, set: () => { } };
const UI = window.SJUI || null;
const FORM = { code: 'SMM-3C-01F/R-4/2026.11.18', co: 'SEJUL SHIP MANAGEMENT CO., LTD.' };
const VES0 = ['KTS GOLD', 'KTS SILVER', 'KTS RED', 'KTS WHITE', 'KTS GREEN', 'KTS BLUE', 'SKY ROYAL', 'SUNNY QUEEN'];
const VES = () => (UI && UI.VES && UI.VES.length ? UI.VES : VES0);
/* 외항선은 별도 양식(하드카피) 방선 보고서 사용 — 이 도구로 만들 수 없음 */
const FOREIGN = ['SUNNY QUEEN', 'KTS WHITE'];
const isForeign = v => FOREIGN.includes(String(v || '').toUpperCase().trim());
const FMSG = '외항선은 이 보고서를 사용할 수 없습니다.';

/* ---------- 점검 항목 (최종 서식 그대로) ---------- */
const I = (no, t, te, p, pe, ph, b, q, sh) => ({ no, t, te, p, pe, ph, b, q: !!q, sh: sh || '' });
const PARTS = [
  { k: 'S', ko: '안품 파트', en: 'Safety & Quality', sup: ['안품 감독 (점검)', 'S&Q superintendent'], items: [
    I('S1', '갑판 항해일지', 'Deck Log Book', '당직 기재·서명, 선위·투묘·훈련 기록', 'Watch entries signed; positions, anchoring, drills recorded.', 1, '선원법', 0, '갑판 항해일지'),
    I('S2', '기름기록부 Part II', 'Oil Record Book Part II', '적·양하, 탱크세정, 슬롭 처리 기재 및 하역 서류와 일치', 'Cargo, tank cleaning, slops entered; matches cargo documents.', 1, '해양환경관리법', 0, '기름기록부 Part II'),
    I('S3', '유해액체물질기록부', 'Cargo Record Book (NLS)', '적·양하, 예비세정, 세정수 처리 기재 (미운송선 NA)', 'NLS operations and tank washings entered (NA if no NLS).', 1, '해양환경관리법', 0, '유해액체물질기록부'),
    I('S4', '폐기물기록부', 'Garbage Record Book', '배출·양륙 기재, 영수증 보관', 'Discharge / landing entries; receipts kept.', 1, '해양환경관리법', 0, '폐기물기록부'),
    I('S5', '항해계획서', 'Passage Plan', '선석~선석 수립, 선장 승인, 위험구역·UKC 반영', 'Berth-to-berth, approved by Master; no-go areas, UKC.', 1, 'SMS', 0, '항해계획서'),
    I('S6', '소화·구명설비 점검표', 'FFA / LSA checklists', '주간·월간 점검 실시·서명, 소화기·구명뗏목·이탈장치 유효기간', 'Weekly / monthly checks signed; extinguisher, liferaft, HRU validity.', 1, '선박안전법·SMS', 0, '소화·구명설비 점검표'),
    I('S7', '비상훈련 기록부', 'Drill records', '주기별 실시, 참석자 서명, 사진 증빙', 'Drills at required intervals, attendance signed, photos.', 1, '선원법', 0, '비상훈련 기록부'),
    I('S8', '해기정보 교육·회람', 'Marine Circulars', '해기정보(사고 사례) 월간 교육 이행 및 회람 서명', 'Monthly training on Marine Circulars; circulation signed.', 1, 'SMS', 0, '해기정보 교육·회람'),
    I('S9', '[현장] 하역 당직 배치, 통신 유지, 탱크 액위 감시', '[Site] Cargo watch manned, communication kept, tank levels monitored.', '', '', 0, 'SMS'),
    I('S10', '[현장] 보호구 착용, 흡연·화기 통제, 거주구역 출입문 폐쇄', '[Site] PPE worn; smoking / naked-light control; doors closed.', '', '', 0, '선원법'),
    I('S11', '[현장] 오염방지 준비: 배수구 플러그, 드립트레이, SOPEP/SMPEP 장비', '[Site] Scuppers plugged, drip trays, SOPEP / SMPEP equipment.', '', '', 1, '해양환경관리법', 0, '오염방지 준비'),
    I('S12', '안전관리 방침 및 안전관리책임자·비상연락망 게시', 'Safety policy, DP and emergency contacts posted.', '', '', 0, 'SMS 1.2, 3.5', 1),
    I('S13', '정박 당직(앵커 감시 경보·위치 확인) 및 입출항 점검표 작성', 'Anchor watch kept; arrival / departure checklists.', '', '', 0, 'SMS 6.17, 6.18', 1),
    I('S14', '해도·수로서지 최신판 및 개정', 'Charts and publications up to date.', '', '', 0, 'SMS 6.22~6.23', 1),
    I('S15', '알코올 점검 (당직 인수인계 시, 월 1회)', 'Alcohol tests (watch handover, monthly).', '', '', 0, 'SMS 6.29', 1),
    I('S16', '비상배치표 최신화·게시 및 비상임무 숙지 (면담 시 질문)', 'Muster list updated; crew know emergency duties.', '', '', 0, 'SMS 7.2~7.3', 1),
    I('S17', '안전관리체제 매뉴얼 최신판 및 파일철 목록 관리', 'SMS manual latest; file index updated.', '', '', 0, 'SMS 10.1, 10.3', 1),
    I('S18', '직전 방선 지적사항 조치 완료 및 부적합 보고서 유지', 'Previous findings closed; NC reports kept.', '', '', 1, 'SMS 11.6', 1, '(분기) 직전 지적사항 조치')] },
  { k: 'T', ko: '공무 파트', en: 'Technical', sup: ['공무 감독 (점검)', 'Technical superintendent'], items: [
    I('T1', '기관일지', 'Engine Log Book', '당직 기재·기관장 서명, 이상·정비 내역, 연료유 수급·잔량', 'Entries signed by C/E; defects, maintenance, bunkers / ROB.', 1, '선원법', 0, '기관일지'),
    I('T2', '기름기록부 Part I', 'Oil Record Book Part I', '코드별 기재·서명, 빌지·슬러지 처리 영수증, 잔량 일치', 'Correct codes, signed; disposal receipts; ROB matches.', 1, '해양환경관리법', 0, '기름기록부 Part I'),

function mrg(a, b) { if (a == null) return b; if (b == null) return a;

function signPad(title, name0, cb, who) {
  modal(`<h3>✍ ${title} <button class="x" data-x>✕</button></h3>
    ${who && name0 ? `<div class="row" style="background:#F4F6FA;border-radius:12px;padding:10px 12px"><div><div class="muted" style="font-size:13px">${esc(who)}</div><b style="font-size:18px" id="snv">${esc(name0)}</b></div><span class="sp"></span><button class="btn s" id="snch">이름 바꾸기</button></div><input class="i" id="sn" value="${esc(name0)}" hidden autocomplete="name">`
      : `<label class="f">성명 Name</label><input class="i" id="sn" value="${esc(name0 || '')}" placeholder="이름을 입력" autocomplete="name">`}
    <label class="f">서명 Signature <span class="muted">— 아래 칸에 손가락으로 서명</span></label><canvas class="pad" id="pad"></canvas>
    <div class="row" style="margin-top:12px"><button class="btn" id="clr">지우기</button><span class="sp"></span><button class="btn" data-x>취소</button><button class="btn p" id="sok">서명 저장</button></div>`, (m, close) => {
    const c = $('#pad', m), ctx = c.getContext('2d'), dpr = Math.max(1, window.devicePixelRatio || 1); let drawn = false, last = null;
    const fit = () => { const r = c.getBoundingClientRect(); c.width = r.width * dpr; c.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B1B3F'; };
    requestAnimationFrame(fit); const ch = $('#snch', m); if (ch) ch.onclick = () => { const i = $('#sn', m); i.hidden = false; ch.parentElement.hidden = true; i.focus(); i.select(); };
    const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); last = pos(e); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, 7); ctx.fillStyle = '#0B1B3F'; ctx.fill(); drawn = true; });
    c.addEventListener('pointermove', e => { if (!last) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
    const up = () => last = null; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    $('#clr', m).onclick = () => { ctx.clearRect(0, 0, c.width, c.height); drawn = false; };
    $('#sok', m).onclick = () => { const nm = $('#sn', m).value.trim(); if (!nm) return toast('성명을 입력해 주세요'); if (!drawn) return toast('서명 칸에 서명해 주세요');
      /* 여백 잘라내기 */
      const W = c.width, H = c.height, d = ctx.getImageData(0, 0, W, H).data; let x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const pad = 8 * dpr; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W, x1 + pad); y1 = Math.min(H, y1 + pad);
      const o = document.createElement('canvas'), k = Math.min(1, 600 / (x1 - x0)); o.width = Math.max(1, (x1 - x0) * k); o.height = Math.max(1, (y1 - y0) * k);
      o.getContext('2d').drawImage(c, x0, y0, x1 - x0, y1 - y0, 0, 0, o.width, o.height);
      const t = now(); close(); cb({ name: nm, img: o.toDataURL('image/png'), at: t, u: t, dev: DEV }); };
  }); }

    /* 이 기기에서 찍은 사진: 한 장씩 따로 (한 번만 올라감) */
    for (const id of [...pend]) { const nm = `VSTP_${id}.json`; if (pushed[nm]) { pend.delete(id); continue; } const d = PH.get(id); if (!d) continue; const rid = (Object.values(R).find(r => photoIds(r).has(id)) || {}).id; const r = R[rid];
      if (!r) continue; if (m && m.role === 'ship' && r.h.ship !== m.ship) continue; out.push({ name: nm, ship: r.h.ship, core: id, obj: { kind: 'SEJUL-VSTP', id, rid, data: d } }); }
    PEND.set(pend); return out; },
  async apply(o) { if (!o) return 0; if (o.kind === 'SEJUL-VST' && o.rep) { const n = await applyRep(o.rep); if (n && R[o.rep.id]) try { SJCLOUD.vstNote && SJCLOUD.vstNote(R[o.rep.id]); } catch (e) { } return n; } if (o.kind === 'SEJUL-VSTP' && o.id && o.data) { if (PHK.has(o.id)) return 0; await photoPut(o.id, o.data, o.rid, false); return 1; } return 0; },
  async after(n) { const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName); if (!$('.mb') && !typing && route().v !== 'p') render(); toast('🔄 다른 감독의 내용을 받았습니다', 2500); paintSync(); }
};

/* ---------- 시작 ---------- */
(async function boot() {
  /* PC 넓은 화면: 앱 공통 왼쪽 메뉴 */
  try { if (UI && UI.css) { const st = document.createElement('style'); st.textContent = UI.css; document.head.appendChild(st); const w = document.createElement('div');
      if (UI.rail && !(UI.phone && UI.phone()) && innerWidth >= 900) { w.innerHTML = UI.rail('vst', '../'); document.body.classList.add('rail'); }
      else if (UI.mobPhone) { w.innerHTML = UI.mobPhone('vst', '../', { off: isOffice() }); document.body.classList.add('bnav'); }   /* 휴대폰: 앱 공통 아래 탭 (선대·승인·정비·위험성·방선) */
      [...w.children].forEach(x => document.body.appendChild(x)); UI.syncPaint && UI.syncPaint(); try { UI.inb && UI.inb.paint && UI.inb.paint(); } catch (e) { } } } catch (e) { console.warn('frame', e); }
  try { await loadAll(); } catch (e) { $('#app').innerHTML = '<main><div class="issues">이 기기의 저장소를 열 수 없습니다 (사생활 보호 모드?): ' + esc(e.message || e) + '</div></main>'; return; }
  /* 올릴 사진 미리 불러오기 */
  for (const id of PEND.get()) { try { await photo(id); } catch (e) { } }
  render();
  try { if (window.SJCLOUD && SJCLOUD.start) { SJCLOUD.start(window.SJ_VST); setInterval(paintSync, 5000); } } catch (e) { console.warn('cloud', e); }
})();
</script>
